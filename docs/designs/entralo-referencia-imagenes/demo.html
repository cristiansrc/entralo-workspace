<script>
const A='../../../estilo/';
const items=[['Festival Luz de Bogotá','Conciertos','Bogotá','Parque Simón Bolívar','Sáb, 18 jul. 2026','evento-summer.jpg','100.000'],['Final de la Capital','Deportes','Bogotá','Estadio El Campín','Sáb, 25 jul. 2026','evento-estadio.jpg','120.000'],['La vida en escena','Teatro','Medellín','Teatro Metropolitano','Vie, 31 jul. 2026','evento-guitarra.jpg','110.000'],['Noche de comedia','Comedia','Cali','Teatro Municipal','Sáb, 8 ago. 2026','evento-comedia.jpg','100.000'],['Festival de verano','Festivales','Medellín','Parque Norte','Dom, 16 ago. 2026','evento-festival.jpg','140.000'],['Guitarras en vivo','Conciertos','Cali','Arena Cañaveralejo','Vie, 21 ago. 2026','evento-guitarra.jpg','105.000'],['Tarde en familia','Familia','Bogotá','Teatro Colón','Dom, 30 ago. 2026','evento-familia.jpg','100.000'],['Noche de ballet','Teatro','Bogotá','Teatro Mayor','Sáb, 5 sep. 2026','evento-ballet.jpg','115.000']];
const state={counts:[1,0,0],category:'',city:'',query:'',mode:'normal',name:'',email:'',phone:'',favorites:new Set(),demoDone:false};
const routes=['inicio','eventos','evento','datos','pago','confirmacion','login','registro'];
let img=(file,alt='')=>`<img src="${A+file}" alt="${alt}">`;
const logo=()=>`<a href="#inicio" class="brand" aria-label="entralo.com, ir al inicio"><img src="../../../estilo/logo.png" alt=""><span class="brand-copy"><span class="brand-mark">entralo<span class="brand-suffix">.com</span></span><small class="brand-tagline">ENTRADAS PARA UN MAÑANA MÁS BRILLANTE</small></span></a>`;
const bannerLogo=()=>`<div class="hero-lockup">${logo()}</div>`;
const btn=(label,href,cls='primary')=>`<a class="btn ${cls}" href="#${href}">${label}</a>`;
function header(checkout=false){return `<header class="site-header ${checkout?'checkout-head':''}"><div class="wrap head-inner">${logo()}${checkout?`<div class="safe-head"><span>♧ Compra de demostración · sin cobro</span><span>¿Necesitas ayuda? <a href="mailto:soporte@example.invalid">Contáctanos</a></span></div>${btn('Volver al inicio','inicio','')}`:`<nav class="nav" aria-label="Navegación principal"><a href="#eventos">Eventos⌄</a><a href="#eventos" data-category="Festivales">Categorías⌄</a><a href="#eventos">Organizadores</a><a href="#eventos">Ayuda</a></nav><form class="head-search" data-search><label class="sr-only" for="global-search">Buscar eventos</label><input class="input" id="global-search" name="q" placeholder="⌕  Buscar eventos, artistas o ciudades"></form>${btn('Ingresar','login','')}${btn('Crear cuenta','registro')}`}</div></header>`}
function footer(){return `<footer class="footer"><div class="wrap footer-inner">${logo()}<div><h3>Explora</h3><a href="#eventos">Eventos</a><a href="#eventos">Categorías</a><a href="#eventos">Ciudades</a></div><div><h3>Soporte</h3><a href="#eventos">Centro de ayuda</a><a href="#inicio">Inicio</a></div><div><h3>Entralo</h3><a href="#login">Mi cuenta</a><a href="#registro">Crear cuenta</a><small>Referencia visual · no es un sitio de venta</small></div></div></footer>`}
function card(e,i){return `<article class="card"><div class="card-photo">${img(e[5],'Fotografía ilustrativa: '+e[1])}<span class="pill">${e[1]}</span><button class="heart" type="button" data-fav="${i}" aria-label="${state.favorites.has(i)?'Quitar de':'Agregar a'} favoritos: ${e[0]}" aria-pressed="${state.favorites.has(i)}">${state.favorites.has(i)?'♥':'♡'}</button></div><div class="card-body"><h3>${e[0]}</h3><p class="meta">▣ &nbsp;${e[4]}</p><p class="meta">♧ &nbsp;${e[3]}, ${e[2]}</p><p class="card-price">Desde <strong>$ ${e[6]} COP</strong></p>${btn('Ver evento →','evento')}</div></article>`}
function cards(list){return `<div class="grid4">${list.map(e=>card(e,items.indexOf(e))).join('')}</div>`}
function home(){return `${header()}<main id="contenido"><div class="hero"><div class="wrap"><h1>Vive momentos<br><em>inolvidables.</em></h1><p>Descubre conciertos, festivales, teatro y experiencias en vivo que acercan a las personas a lo que las mueve.</p><div class="row">${btn('Explorar eventos →','eventos')}${btn('Ver categorías','eventos','outline-light')}</div></div></div><div class="wrap"><form class="search-panel" data-search><div class="fieldmini"><label for="home-cat">Categoría</label><select id="home-cat" name="category"><option value="">Todas las categorías</option><option>Conciertos</option><option>Teatro</option><option>Deportes</option><option>Festivales</option></select></div><div class="fieldmini"><label for="home-city">Ciudad</label><select id="home-city" name="city"><option value="">¿Dónde quieres ir?</option><option>Bogotá</option><option>Medellín</option><option>Cali</option></select></div><div class="fieldmini"><label for="home-date">Fecha</label><select id="home-date"><option>Cualquier fecha</option><option>Próximos eventos</option></select></div><button class="btn primary" type="submit">⌕ &nbsp;Buscar eventos</button></form><section class="section"><div class="section-title"><h2>Eventos destacados</h2><a class="link" href="#eventos">Ver todos los eventos →</a></div>${cards(items.slice(0,4))}</section><section class="section"><div class="section-title"><h2>Categorías populares</h2><a class="link" href="#eventos">Ver todas las categorías →</a></div><div class="categories">${[['♫','Conciertos','Música en vivo'],['🏆','Deportes','La emoción en grande'],['🎭','Teatro','Historias que inspiran'],['✦','Festivales','Experiencias inolvidables'],['♬','Comedia','Ríe y comparte']].map(c=>`<a class="category" href="#eventos" data-category="${c[1]}"><span aria-hidden="true">${c[0]}</span><span>${c[1]}<small>${c[2]}</small></span></a>`).join('')}</div></section><section class="section"><h2>Cómo funciona</h2><div class="steps-simple"><div><b>1</b><span><strong>Descubre</strong><small>Busca experiencias en tu ciudad.</small></span></div><div><b>2</b><span><strong>Reserva</strong><small>Elige entradas según disponibilidad.</small></span></div><div><b>3</b><span><strong>Disfruta</strong><small>Vive el momento.</small></span></div></div></section><div class="promo"><strong>Festival Luz de Bogotá</strong><span>18 de julio · Bogotá</span>${btn('Ver evento →','evento','')}</div></div></main>${footer()}`}
function catalog(){let list=items.filter(e=>(!state.category||e[1]===state.category)&&(!state.city||e[2]===state.city)&&(!state.query||[e[0],e[1],e[2],e[3]].join(' ').toLocaleLowerCase('es').includes(state.query.toLocaleLowerCase('es'))));let modes={loading:'<h3>Cargando eventos…</h3><p>Estamos preparando las opciones de esta ciudad.</p>',error:'<h3>No pudimos cargar los eventos</h3><p>Revisa tu conexión e intenta otra vez.</p>',offline:'<h3>Estás sin conexión</h3><p>La lista de eventos necesita conexión. Puedes volver a intentarlo.</p>',restricted:'<h3>Acceso requerido</h3><p>Para guardar favoritos, inicia sesión. El catálogo permanece público.</p>',partial:'<h3>Algunos resultados no están disponibles</h3><p>Mostramos los eventos que sí se pudieron recuperar.</p>'};return `${header()}<main id="contenido"><div class="banner"><div class="wrap"><h1>Explora <em>eventos</em></h1><p>Conciertos, festivales, teatro, deportes y mucho más.<br>Encuentra experiencias en vivo que te hacen sentir más.</p></div></div><div class="wrap"><form class="catalog-search" data-search><label class="sr-only" for="catalog-q">Buscar eventos, artistas, ciudades o recintos</label><input class="input" id="catalog-q" name="q" placeholder="⌕  Busca eventos, artistas, ciudades o recintos..." value="${escapeHtml(state.query)}"><button type="submit" class="btn primary">⌕ &nbsp;Buscar eventos</button></form><div class="chips"><strong style="font-size:12px">Búsquedas populares:</strong><button class="chip" data-chip="" type="button">Todos</button><button class="chip" data-chip="Bogotá" type="button">♧ Bogotá</button><button class="chip" data-chip="Medellín" type="button">♧ Medellín</button><button class="chip" data-chip="Conciertos" type="button">♫ Conciertos</button><button class="chip" data-chip="Deportes" type="button">🏆 Deportes</button></div><div class="catalog-layout"><aside class="panel filters" aria-label="Filtros de eventos"><div class="section-title"><h2>Filtros</h2><button class="link" type="button" data-reset>Limpiar todo</button></div><h3>Categoría</h3>${['Conciertos','Deportes','Teatro','Festivales','Comedia','Familia'].map(x=>`<label class="check"><input type="radio" name="filtercat" value="${x}" ${state.category===x?'checked':''}>${x}</label>`).join('')}<h3>Ciudad</h3><label class="sr-only" for="city-filter">Filtrar por ciudad</label><select class="input" id="city-filter"><option value="">Todas las ciudades</option>${['Bogotá','Medellín','Cali'].map(x=>`<option ${state.city===x?'selected':''}>${x}</option>`).join('')}</select><h3>Fecha</h3><span class="muted" style="font-size:12px">Próximas fechas · ejemplo local</span></aside><section aria-label="Resultados de eventos"><div class="catalog-top"><h2>${state.mode==='normal'?list.length+' eventos de ejemplo':'Explorar eventos'}</h2><label>Ordenar por: <select class="input" id="sort"><option>Relevancia</option><option>Nombre</option></select></label></div><div class="state-tools"><label for="mode">Probar estados del catálogo:</label><select class="input" id="mode"><option value="normal">Normal</option><option value="loading">Cargando</option><option value="error">Error</option><option value="partial">Parcial</option><option value="restricted">Sin acceso</option><option value="offline">Sin conexión</option></select></div><div role="status" aria-live="polite">${state.mode==='normal'?(list.length?cards(list):'<div class="panel empty-state"><h3>No encontramos eventos</h3><p>Prueba con otra ciudad o borra los filtros.</p><button class="btn primary" data-reset type="button">Limpiar filtros</button></div>'):(state.mode==='partial'?`<div class="notice purple">${modes.partial}</div>${cards(list.slice(0,4))}`:`<div class="panel empty-state">${modes[state.mode]}${state.mode==='restricted'?btn('Iniciar sesión','login'):'<button type="button" class="btn primary" data-retry>Reintentar</button>'}</div>`)}</div></section></div></div></main>${footer()}`}
function event(){return `${header()}<main id="contenido"><div class="detail-hero"><div class="wrap"><div class="detail-title"><small style="color:white"><a href="#inicio">Inicio</a> &nbsp;/&nbsp; <a href="#eventos">Eventos</a> &nbsp;/&nbsp; Festival Luz de Bogotá</small><div class="row" style="margin-top:18px"><span class="pill">Música</span><span class="pill">Festival</span></div><h1>Festival Luz<br>de Bogotá</h1><p>Música, amigos y una noche para recordar. Una experiencia en vivo bajo las luces de la ciudad.</p><div class="row"><span>▣ &nbsp; Sáb, 18 jul. 2026<small>18:00 · hora local</small></span><span>♧ &nbsp; Parque Simón Bolívar<small>Bogotá, Colombia</small></span><span>♙ &nbsp; Entralo<small>Evento ilustrativo</small></span></div></div><aside class="ticket-picker" aria-label="Selección de entradas"><div class="notice purple"><strong>Selecciona tus entradas</strong>La disponibilidad se confirma en el proceso real.</div><h2>Selecciona tus entradas</h2>${['General','Preferencial','Palco'].map((t,i)=>`<div class="ticket-row"><div><strong>${t}</strong><small>${i===0?'Acceso general':'Localidad de ejemplo'}</small></div><strong>$ ${['120.000','180.000','250.000'][i]} COP</strong><div class="counter"><button type="button" data-count="${i}" data-delta="-1" aria-label="Quitar una entrada ${t}">−</button><output id="count-${i}" aria-label="Cantidad ${t}">${state.counts[i]}</output><button type="button" data-count="${i}" data-delta="1" aria-label="Agregar una entrada ${t}">+</button></div></div>`).join('')}<p class="disclaimer">Precios nominales ilustrativos por boleta. Cargo configurable por evento (15% del nominal por defecto) + IVA sobre el cargo. Los costos de transacción/Mercado Pago, blockchain y demás se cubren desde este cargo; no hay recargo de pasarela separado sobre el precio nominal. IVA sujeto a validación fiscal; sin tasa definida no se calcula el total final. No hay reserva activa en este demo.</p><button class="btn primary wide" type="button" data-continue>Continuar con mis entradas →</button></aside></div></div><div class="wrap"><div class="detail-content"><section class="panel"><h2>Acerca del evento</h2><p>Una noche de música en vivo en Bogotá con propuestas locales, luces y experiencias para compartir. Contenido ficticio para ilustrar la composición de la referencia.</p><div class="row"><span class="pill">♫ Música en vivo</span><span class="pill">✦ Al aire libre</span><span class="pill">♧ Bogotá</span></div></section><section class="panel"><h2>Información del evento</h2><p>▣ &nbsp; Sábado 18 de julio de 2026</p><p>◷ &nbsp; 18:00 · hora local</p><p>♧ &nbsp; Parque Simón Bolívar, Bogotá</p><p>♙ &nbsp; Organiza: Entralo (ejemplo)</p></section><section class="panel"><h2>Artistas invitados</h2><div class="artists">${['evento-guitarra.jpg','evento-festival.jpg','evento-comedia.jpg','evento-summer.jpg'].map(x=>img(x,'Imagen ilustrativa de artista en escena')).join('')}</div></section><section class="panel"><h2>Información adicional</h2><p>Las políticas, el mapa final del recinto y los detalles de acceso están pendientes de definición. Este demo no garantiza disponibilidad ni emite entradas.</p></section></div><section class="section"><div class="section-title"><h2>También te puede interesar</h2><a href="#eventos" class="link">Ver todos los eventos →</a></div>${cards(items.slice(1,5))}</section></div></main>${footer()}`}
function stepper(n){return `<nav class="stepper" aria-label="Pasos de compra">${[['Selección','Entradas elegidas'],['Datos','Tus datos de compra'],['Pago','Método de pago'],['Confirmación','Demo finalizado']].map((x,i)=>`<div class="step ${i+1<n?'done':i+1===n?'current':''}" ${i+1===n?'aria-current="step"':''}><b>${i+1<n?'✓':i+1}</b><span><strong>${x[0]}</strong><small>${x[1]}</small></span></div>`).join('')}</nav>`}
function eventPanel(){return `<section class="panel"><div class="panel-title"><span class="icon">♙</span><h2>Evento seleccionado</h2></div><div class="selected-event">${img('evento-summer.jpg','Concierto ilustrativo con luces y público')}<div><h2>Festival Luz de Bogotá</h2><p>Música, amigos y una noche para recordar</p><p>▣ Sáb, 18 de julio de 2026 · 18:00<br>♧ Parque Simón Bolívar, Bogotá</p><a href="#evento" class="link">Ver más información →</a></div></div></section>`}
function checkout(page){let n={datos:2,pago:3,confirmacion:4}[page];return `${header(true)}<main id="contenido" class="wrap">${page==='confirmacion'?'':`<h1 class="sr-only">${page==='datos'?'Datos del comprador':'Método de pago'}</h1>`}${stepper(n)}<div class="checkout-layout"><div>${page==='confirmacion'?confirmation():`${eventPanel()}${page==='datos'?dataForm():paymentForm()}`}</div>${summary(page==='confirmacion')}</div></main>${footer()}`}
function field(id,label,type,value,extra=''){return `<div class="form-field"><label for="${id}">${label} <span aria-hidden="true">*</span></label><input class="input" id="${id}" name="${id}" type="${type}" required ${extra} value="${escapeHtml(value)}"><p class="error" id="${id}-error" aria-live="polite"></p></div>`}
function dataForm(){return `<form class="panel" id="buyer-form" novalidate><div class="panel-title"><span class="icon">▤</span><div><h2>Datos del comprador</h2><small>Introduce tus datos para continuar con la simulación.</small></div></div><div class="form-grid">${field('buyer-name','Nombre completo','text',state.name,'autocomplete="name" placeholder="Ej. Ana Gómez"')}${field('buyer-email','Correo electrónico','email',state.email,'autocomplete="email" placeholder="ana@ejemplo.com"')}${field('buyer-phone','Teléfono móvil','tel',state.phone,'autocomplete="tel" placeholder="Ej. 300 123 4567"')}</div><p class="disclaimer">No se envían ni guardan los datos fuera de esta pestaña. No hay reserva, cobro ni emisión real.</p><div class="row">${btn('← Volver a las entradas','evento','')}<button class="btn primary" type="submit">Continuar al método de pago →</button></div><p role="status" class="status" id="buyer-status"></p></form>`}
function confirmation(){return `<section class="confirmation-hero"><span class="big-check" aria-hidden="true">✓</span><div><h1>¡Simulación completada!</h1><p>Esta es una confirmación <strong>ficticia de demostración</strong> para Festival Luz de Bogotá. No se procesó ningún pago, no se enviaron correos ni se emitieron boletas.</p></div></section><section class="panel" style="margin-top:10px"><div class="selected-event">${img('evento-summer.jpg','Imagen ilustrativa del festival')}<div><h2>Festival Luz de Bogotá</h2><p>▣ Sáb, 18 jul. 2026 · 18:00<br>♧ Parque Simón Bolívar, Bogotá</p><p>Referencia visual: DEMO-LOCAL (no es un pedido).</p></div></div><div class="row" style="margin-top:16px">${btn('Explorar más eventos','eventos')}${btn('Volver al inicio','inicio','')}</div></section><section class="panel"><h2>Tus entradas · vista ilustrativa</h2><p>Ninguna entrada ha sido emitida. Los recuadros siguientes no son credenciales de acceso.</p>${Array.from({length:Math.max(1,Math.min(3,state.counts.reduce((a,b)=>a+b,0)))},(_,i)=>`<div class="fake-ticket"><div class="not-qr" aria-label="Marcador visual no escaneable">SIN<br>QR</div><div><strong>Vista de entrada ${i+1} · NO VÁLIDA</strong><small>Festival Luz de Bogotá · Bogotá</small><br><small>Marcador no escaneable. No permite ingreso.</small></div></div>`).join('')}</section>`}
function auth(page){let reg=page==='registro';return `${header()}<main id="contenido"><div class="auth-wrap"><div class="auth-photo"><h2>${reg?'Guarda tus favoritos, sigue tus compras y ':'Vive momentos '}<em>${reg?'vive cada evento al máximo.':'inolvidables.'}</em></h2><p>${reg?'Explora eventos en tu ciudad y mantén tus experiencias en un solo lugar.':'Conciertos, festivales, teatro y experiencias en vivo que acercan a las personas a lo que las mueve.'}</p><div class="auth-points"><p>◇ &nbsp; <strong>Descubre</strong> · Eventos únicos en Colombia</p><p>♡ &nbsp; <strong>Vive más</strong> · Experiencias a tu medida</p><p>✦ &nbsp; <strong>Comparte</strong> · Momentos inolvidables</p></div></div><div class="auth-form">${logo()}<h1>${reg?'Crear cuenta':'Inicia sesión'}</h1><p class="muted">${reg?'Regístrate para descubrir eventos y gestionar tus favoritos.':'Accede para seguir tus eventos favoritos. Formulario de demostración: no inicia sesión real.'}</p><form id="auth-form" novalidate>${reg?field('auth-name','Nombre completo','text','','autocomplete="name" placeholder="Ej. Ana Gómez"'):''}${field('auth-email','Correo electrónico','email','','autocomplete="email" placeholder="tu@correo.com"')}${field('auth-password','Contraseña','password','','autocomplete="'+(reg?'new':'current')+'-password" placeholder="Introduce tu contraseña" minlength="8"')}${reg?field('auth-confirm','Confirmar contraseña','password','','autocomplete="new-password" placeholder="Repite tu contraseña"'):''}<button type="submit" class="btn primary wide">${reg?'Crear cuenta (simulado)':'Ingresar (simulado)'} →</button><p role="status" class="status" id="auth-status"></p></form><div class="auth-switch">${reg?'¿Ya tienes cuenta? <a href="#login">Inicia sesión →</a>':'¿No tienes cuenta? <a href="#registro">Crear cuenta →</a>'}</div><p class="disclaimer">Sin autenticación, proveedores sociales ni tratamiento de datos real.</p></div></div></main>${footer()}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function route(focus=false){let page=location.hash.slice(1)||'inicio';if(!routes.includes(page))page='inicio';document.getElementById('app').innerHTML=({inicio:home,eventos:catalog,evento:event,datos:()=>checkout('datos'),pago:()=>checkout('pago'),confirmacion:()=>checkout('confirmacion'),login:()=>auth('login'),registro:()=>auth('registro')})[page]();let mode=document.getElementById('mode');if(mode)mode.value=state.mode;document.title='Entralo · '+page+' · demo sin transacciones';window.scrollTo(0,0);let main=document.querySelector('#contenido');main?.setAttribute('tabindex','-1');if(focus)main?.focus({preventScroll:true})}
function go(page){if(location.hash==='#'+page)route();else location.hash=page}
document.addEventListener('click',e=>{let el=e.target.closest('[data-fav],[data-category],[data-chip],[data-reset],[data-retry],[data-count],[data-continue],#simulate-payment');if(!el)return;if(el.dataset.fav!==undefined){let i=+el.dataset.fav;state.favorites.has(i)?state.favorites.delete(i):state.favorites.add(i);let selected=state.favorites.has(i);el.textContent=selected?'♥':'♡';el.setAttribute('aria-pressed',String(selected));el.setAttribute('aria-label',`${selected?'Quitar de':'Agregar a'} favoritos: ${items[i][0]}`)}else if(el.dataset.category!==undefined){state.category=el.dataset.category;state.query='';if(location.hash==='#eventos')route()}else if(el.dataset.chip!==undefined){let v=el.dataset.chip;state.query='';state.category=['Conciertos','Deportes'].includes(v)?v:'';state.city=['Bogotá','Medellín'].includes(v)?v:'';route()}else if(el.dataset.reset!==undefined){state.category=state.city=state.query='';state.mode='normal';route()}else if(el.dataset.retry!==undefined){state.mode='normal';route()}else if(el.dataset.count!==undefined){let i=+el.dataset.count;state.counts[i]=Math.max(0,Math.min(9,state.counts[i]+Number(el.dataset.delta)));document.getElementById('count-'+i).textContent=state.counts[i];if(state.counts.some(Boolean))document.getElementById('ticket-error')?.remove()}else if(el.dataset.continue!==undefined){if(state.counts.some(Boolean))go('datos');else if(!document.getElementById('ticket-error')){let msg=Object.assign(document.createElement('p'),{id:'ticket-error',textContent:'Selecciona al menos una entrada para continuar.',className:'error'});msg.setAttribute('role','alert');el.after(msg)}}else if(el.id==='simulate-payment'){state.demoDone=true;go('confirmacion')}});
document.addEventListener('submit',e=>{if(e.target.matches('[data-search]')){e.preventDefault();let f=new FormData(e.target);state.query=(f.get('q')||'').toString().trim();if(f.has('category'))state.category=f.get('category');if(f.has('city'))state.city=f.get('city');state.mode='normal';go('eventos')}if(e.target.id==='buyer-form'){e.preventDefault();let name=document.getElementById('buyer-name'),mail=document.getElementById('buyer-email'),phone=document.getElementById('buyer-phone');let ok=true;for(let [el,msg] of [[name,'Escribe tu nombre completo.'],[mail,'Escribe un correo electrónico válido.'],[phone,'Escribe un número de contacto.']]){let valid=el===mail?el.validity.valid&&!!el.value.trim():!!el.value.trim();el.setAttribute('aria-invalid',String(!valid));el.setAttribute('aria-describedby',el.id+'-error');document.getElementById(el.id+'-error').textContent=valid?'':msg;if(!valid){if(ok)el.focus();ok=false}}if(ok){state.name=name.value;state.email=mail.value;state.phone=phone.value;go('pago')}}if(e.target.id==='auth-form'){e.preventDefault();let all=[...e.target.querySelectorAll('input')];let ok=true;for(let el of all){let valid=el.validity.valid&&!!el.value.trim();if(el.id==='auth-confirm')valid=valid&&el.value===document.getElementById('auth-password').value;el.setAttribute('aria-invalid',String(!valid));el.setAttribute('aria-describedby',el.id+'-error');document.getElementById(el.id+'-error').textContent=valid?'':el.id==='auth-confirm'?'Las contraseñas deben coincidir.':el.type==='email'?'Introduce un correo válido.':el.type==='password'?'Usa al menos 8 caracteres.':'Completa este campo.';if(!valid){if(ok)el.focus();ok=false}}if(ok)document.getElementById('auth-status').textContent='Formulario válido. Este demo no crea cuentas ni inicia sesión.'}});
document.addEventListener('change',e=>{if(e.target.name==='filtercat'){state.category=e.target.value;route()}if(e.target.id==='city-filter'){state.city=e.target.value;route()}if(e.target.id==='mode'){state.mode=e.target.value;route()}if(e.target.id==='sort'&&e.target.value==='Nombre'){document.querySelectorAll('.grid4').forEach(grid=>[...grid.children].sort((a,b)=>a.querySelector('h3').textContent.localeCompare(b.querySelector('h3').textContent,'es')).forEach(node=>grid.append(node)))}});
window.addEventListener('hashchange',()=>route(true));
</script>
<script>
/* Capa de refinamiento del prototipo: símbolos SVG propios, sin fuentes de iconos ni emoji. */
const paths={heart:'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z',search:'m21 21-4.35-4.35 M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16',calendar:'M3 6h18v15H3z M7 3v6 M17 3v6 M3 10h18',pin:'M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z M12 10h.01',ticket:'M2 9V4h20v5a3 3 0 0 0 0 6v5H2v-5a3 3 0 0 0 0-6Z M13 4v16',music:'M9 18V5l12-2v13 M9 18a3 2 0 1 1-6 0 3 2 0 0 1 6 0 M21 16a3 2 0 1 1-6 0 3 2 0 0 1 6 0',trophy:'M7 3h10v7a5 5 0 0 1-10 0V3Z M7 5H3v3a4 4 0 0 0 4 4 M17 5h4v3a4 4 0 0 1-4 4 M12 15v5 M8 21h8',theater:'M3 4h8v12l-4 4-4-4V4Z M13 4h8v12l-4 4-4-4V4Z M5 9h4 M15 9h4 M5 13c1 2 3 2 4 0 M15 13c1 2 3 2 4 0',sparkles:'m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2Z',users:'M7 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M17 12a3 3 0 1 0 0-6 M2 21v-2a5 5 0 0 1 10 0v2 M15 17a4 4 0 0 1 7 3v1',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21v-2a8 8 0 0 1 16 0v2',cart:'M2 3h2l3 13h12l3-9H5 M9 21h.01 M18 21h.01',mail:'M3 5h18v14H3z M3 6l9 7 9-7',card:'M2 5h20v14H2z M2 10h20',shield:'M12 2 4 5v6c0 5 3 8 8 11 5-3 8-6 8-11V5l-8-3Z M9 12l2 2 4-4',lock:'M5 11h14v11H5z M8 11V7a4 4 0 1 1 8 0v4',eye:'M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',mic:'M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z M5 10a7 7 0 0 0 14 0 M12 17v4 M8 21h8',chevron:'m6 9 6 6 6-6'};
const svg=(name,cls='ui-icon')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${paths[name]}"></path></svg>`;
const favoriteSvg=()=>svg('heart','favorite-icon');
card=(e,i)=>`<article class="card"><div class="card-photo">${img(e[5],'Fotografía ilustrativa: '+e[1])}<span class="pill">${e[1]}</span><button class="heart" type="button" data-fav="${i}" aria-label="${state.favorites.has(i)?'Quitar de':'Agregar a'} favoritos: ${e[0]}" aria-pressed="${state.favorites.has(i)}">${favoriteSvg()}</button></div><div class="card-body"><h3>${e[0]}</h3><p class="meta">${svg('calendar')} ${e[4]}</p><p class="meta">${svg('pin')} ${e[3]}, ${e[2]}</p><p class="card-price">Desde <strong>$ ${e[6]} COP</strong></p>${btn('Ver evento →','evento')}</div></article>`;
const originalAuth=auth;
auth=page=>{if(page!=='login')return originalAuth(page);return `${header()}<main id="contenido"><div class="auth-wrap login-layout"><div class="auth-photo" role="img" aria-label="Concierto con público y luces violetas. Imagen de referencia con el texto: Vive momentos inolvidables; descubre, compra con confianza y vive más."><h2>Vive momentos inolvidables.</h2></div><div class="auth-side"><section class="auth-form" aria-labelledby="login-title">${logo()}<h1 id="login-title">Inicia sesión</h1><p class="muted">Accede para seguir tus eventos favoritos. Formulario de demostración: no inicia sesión real.</p><form id="auth-form" novalidate>${field('auth-email','Correo electrónico','email','','autocomplete="email" placeholder="tu@email.com"')}${field('auth-password','Contraseña','password','','autocomplete="current-password" placeholder="Introduce tu contraseña" minlength="8"')}<div class="auth-option-row"><label><input type="checkbox" id="auth-remember">Recordarme en este dispositivo</label><button type="button" data-auth-help>¿Olvidaste tu contraseña?</button></div><button type="submit" class="btn primary wide">Ingresar (simulado) →</button><p role="status" class="status" id="auth-status"></p></form><div class="auth-separator">O continúa con</div><div class="social-options" aria-describedby="social-note"><button type="button" class="btn" disabled>${svg('user')} Continuar con Google</button><button type="button" class="btn" disabled>${svg('user')} Continuar con Apple</button></div><p id="social-note" class="disclaimer">Google y Apple son referencias visuales; no están disponibles en este demo.</p><div class="auth-switch">¿No tienes cuenta? <a href="#registro">Crear cuenta →</a></div><p class="disclaimer">Sin autenticación ni tratamiento de datos real. «Recordarme» solo permanece en esta pantalla.</p></section></div></div></main>${footer()}`};
function normalizeIcons(){
  const replaceLeading=(selector,match,icon)=>document.querySelectorAll(selector).forEach(el=>{const n=[...el.childNodes].find(node=>node.nodeType===Node.TEXT_NODE&&match.test(node.textContent));if(n){n.textContent=n.textContent.replace(match,'');n.before(document.createRange().createContextualFragment(svg(icon)))}});
   document.querySelectorAll('.category span:first-child').forEach(el=>{const label=el.closest('.category')?.textContent;const name=({Conciertos:'music',Deportes:'trophy',Teatro:'theater',Festivales:'sparkles',Comedia:'mic'})[label];if(name)el.innerHTML=svg(name)});
  document.querySelectorAll('.icon').forEach(el=>{const text=el.textContent;el.innerHTML=svg(text==='🛒'?'cart':text==='▤'?'card':'user')});
  document.querySelectorAll('.chip').forEach(el=>{const label=el.textContent;let name=label.includes('Bogotá')||label.includes('Medellín')?'pin':label.includes('Conciertos')?'music':label.includes('Deportes')?'trophy':null;if(name)el.innerHTML=svg(name)+' '+label.replace(/^[^\p{L}]+/u,'')});
   document.querySelectorAll('.selected-event p, .summary-event small, .detail-title .row span, .summary-event p').forEach(el=>{const n=[...el.childNodes].find(node=>node.nodeType===Node.TEXT_NODE&&/^[\s]*[▣♧♙]/.test(node.textContent));if(n){const symbol=n.textContent.match(/[▣♧♙]/)[0];n.textContent=n.textContent.replace(/^[\s]*[▣♧♙]/,'');n.before(document.createRange().createContextualFragment(svg(({ '▣':'calendar','♧':'pin','♙':'user'})[symbol])))}});
  document.querySelectorAll('.notice strong').forEach(el=>{if(/^[✉♧]/.test(el.textContent)){let name=el.textContent.startsWith('✉')?'mail':'shield';el.innerHTML=svg(name)+' '+el.textContent.slice(1)}});
  document.querySelectorAll('.head-search input, .catalog-search input').forEach(el=>el.placeholder=el.placeholder.replace(/^[⌕\s]+/,''));
  document.querySelectorAll('.search-panel button, .catalog-search button').forEach(el=>{if(el.textContent.includes('⌕'))el.innerHTML=svg('search')+' Buscar eventos'});
  document.querySelectorAll('.auth-points p').forEach((el,i)=>{el.innerHTML=svg(['ticket','heart','sparkles'][i])+' '+el.innerHTML.replace(/^[◇♡✦]\s*&nbsp;\s*/,'')});
}
const baseRoute=route;route=function(focus=false){baseRoute(focus);for(const hero of document.querySelectorAll('.hero,.banner'))hero.querySelector('.wrap')?.insertAdjacentHTML('afterbegin',bannerLogo());normalizeIcons()};
document.addEventListener('click',e=>{let fav=e.target.closest('[data-fav]');if(fav){e.stopImmediatePropagation();const i=Number(fav.dataset.fav);const selected=!state.favorites.has(i);if(selected)state.favorites.add(i);else state.favorites.delete(i);fav.setAttribute('aria-pressed',String(selected));fav.setAttribute('aria-label',`${selected?'Quitar de':'Agregar a'} favoritos: ${items[i][0]}`);return}if(e.target.closest('[data-auth-help]')){document.getElementById('auth-status').textContent='Recuperación no disponible en este demo. No se ha enviado ningún correo.'}},true);
</script>
<script>
/* Las fotografías del evento se asignan por filename en la capa final, no por recortes. */
/* El mismo contorno SVG se conserva al pulsar: aria-pressed y fill son los únicos cambios. */
const originalField=field;
field=(id,label,type,value,extra='')=>{
  let html=originalField(id,label,type,value,extra);
  if(!id.startsWith('auth-'))return html;
  const icon=id==='auth-email'?'mail':id.includes('password')||id==='auth-confirm'?'lock':'user';
  return html.replace('class="form-field"','class="form-field auth-field"').replace(/(<input[^>]+>)/,`${svg(icon)}$1${type==='password'?`<button class="reveal" type="button" data-reveal="${id}" aria-label="Mostrar ${label.toLowerCase()}" aria-pressed="false">${svg('eye')}</button>`:''}`);
};
function socialButtons(reg){return `<div class="auth-separator">O continúa con</div><div class="social-options" aria-describedby="social-note"><button type="button" class="btn" disabled><span class="google-g" aria-hidden="true">G</span> ${reg?'Registrarme':'Continuar'} con Google</button><button type="button" class="btn" disabled><svg class="social-brand" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.3 12.5c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.2-2.7.8-3.4.8-.8 0-1.9-.8-3.1-.8-1.6 0-3.2 1-4 2.4-1.8 3.1-.5 7.7 1.3 10.3.9 1.3 1.8 2.7 3.2 2.7 1.3-.1 1.8-.9 3.4-.9 1.5 0 2 .9 3.4.8 1.5 0 2.4-1.3 3.3-2.6.7-1 1-1.5 1.5-2.7-3.1-1.2-3.8-4.7-2.3-6.1ZM15.2 5.9c.7-.8 1.2-1.9 1.1-3-.9.1-2 .6-2.7 1.4-.7.8-1.2 1.9-1.1 2.9 1 0 2-.5 2.7-1.3Z"/></svg> ${reg?'Registrarme':'Continuar'} con Apple</button></div><p id="social-note" class="disclaimer">Google y Apple son referencias visuales; no están disponibles en este demo.</p>`}
auth=page=>{let reg=page==='registro';return `${header()}<main id="contenido"><div class="auth-wrap ${reg?'register-layout':'login-layout'}"><div class="auth-photo" role="img" aria-label="${reg?'Concierto violeta con texto de inspiración y beneficios de una cuenta Entralo.':'Concierto con luces violetas, público y beneficios para descubrir eventos.'}"><h2>${reg?'Guarda tus favoritos, sigue tus compras y vive cada evento al máximo.':'Vive momentos inolvidables.'}</h2></div>${reg?'':'<div class="auth-side">'}<section class="auth-form" aria-labelledby="auth-title">${reg?'':logo()}${reg?'<p class="muted">Únete a Entralo</p>':''}<h1 id="auth-title">${reg?'Crear cuenta':'Inicia sesión'}</h1><p class="muted">${reg?'Regístrate para descubrir eventos y gestionar tus favoritos.':'Accede para seguir tus eventos favoritos. Esta pantalla no inicia sesión real.'}</p><form id="auth-form" novalidate>${reg?field('auth-name','Nombre completo','text','','autocomplete="name" placeholder="Ej. Ana Gómez"'):''}${field('auth-email','Correo electrónico','email','','autocomplete="email" placeholder="tu@email.com"')}${field('auth-password','Contraseña','password','','autocomplete="'+(reg?'new':'current')+'-password" placeholder="'+(reg?'Crea una contraseña':'Introduce tu contraseña')+'" minlength="8"')}${reg?field('auth-confirm','Confirmar contraseña','password','','autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8"'):''}${reg?'':`<div class="auth-option-row"><label><input type="checkbox" id="auth-remember">Recordarme en este dispositivo</label><button type="button" data-auth-help>¿Olvidaste tu contraseña?</button></div>`}<button type="submit" class="btn primary wide">${reg?'Crear cuenta':'Ingresar (simulado)'} →</button><p role="status" class="status" id="auth-status"></p></form>${socialButtons(reg)}<div class="auth-switch">${reg?'¿Ya tienes cuenta? <a href="#login">Inicia sesión →</a>':'¿No tienes cuenta? <a href="#registro">Crear cuenta →</a>'}</div><p class="disclaimer">Demostración local: sin autenticación, cobros ni tratamiento real de datos.</p></section>${reg?'':'</div>'}</div></main>${footer()}`};
const previousNormalize=normalizeIcons;
normalizeIcons=function(){
  previousNormalize();
  document.querySelectorAll('.category span:first-child').forEach(el=>{const text=el.closest('.category')?.textContent||'';const name=Object.entries({Conciertos:'music',Deportes:'trophy',Teatro:'theater',Festivales:'sparkles',Comedia:'mic'}).find(([label])=>text.includes(label))?.[1];if(name)el.innerHTML=svg(name)});
  const icons={'▣':'calendar','♧':'pin','♙':'user','♫':'music','🏆':'trophy','🎭':'theater','♬':'mic','✦':'sparkles','⌕':'search','🛒':'cart','✉':'mail'};
  document.querySelectorAll('.selected-event p,.summary-event small,.detail-title .row span,.safe-head span,.method,.panel-title .icon').forEach(el=>{
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;const matches=[];
    while(node=walker.nextNode())if(/[▣♧♙♫🏆🎭♬✦⌕🛒✉]/u.test(node.textContent))matches.push(node);
    for(const text of matches){let parts=text.textContent.split(/([▣♧♙♫🏆🎭♬✦⌕🛒✉])/u);let frag=document.createDocumentFragment();for(let p of parts){if(icons[p]){let holder=document.createElement('span');holder.innerHTML=svg(icons[p]);frag.append(...holder.childNodes)}else frag.append(document.createTextNode(p))}text.replaceWith(frag)}
  });
};
document.addEventListener('click',e=>{let btn=e.target.closest('[data-reveal]');if(!btn)return;let input=document.getElementById(btn.dataset.reveal);let visible=input.type==='password';input.type=visible?'text':'password';btn.setAttribute('aria-pressed',String(visible));btn.setAttribute('aria-label',`${visible?'Ocultar':'Mostrar'} ${input.labels[0].textContent.trim()}`);input.focus()},true);
/* Correspondencias por tema y filename; no se atribuye identidad a artistas/equipos. */
const eventFiles=['evento1.png','evento3.png','evento2.png','evento4.png','evento5.png','evento6.png','evento7.png','evento8.png'];
items.forEach((e,i)=>e[5]=eventFiles[i]);
img=(file,alt='')=>{
  const fallback={'evento-summer.jpg':'evento1.png','evento-estadio.jpg':'evento3.png','evento-guitarra.jpg':'evento6.png','evento-comedia.jpg':'evento4.png','evento-festival.jpg':'evento5.png','evento-familia.jpg':'evento7.png','evento-ballet.jpg':'evento8.png'};
  const name=eventFiles.includes(file)?file:(fallback[file]||'evento1.png');
  return `<span class="photo-frame"><img src="../../../estilo/${name}" alt="${escapeHtml(alt||'Imagen ilustrativa del evento')}" loading="lazy"></span>`;
};
let selectedEvent=0;
const originalCard=card;
card=(e,i)=>originalCard(e,i).replace('href="#evento"','href="#evento" data-event="'+i+'"').replace(`alt="Fotografía ilustrativa: ${e[1]}"`,`alt="Imagen ilustrativa de ${e[0]}: ${e[1]}"`);
document.addEventListener('click',e=>{const link=e.target.closest('a[data-event]');if(!link)return;selectedEvent=Number(link.dataset.event);if(location.hash==='#evento')setTimeout(()=>route(true),0)},true);
const imageRoute=route;
route=function(focus=false){
  imageRoute(focus);
  const page=location.hash.slice(1)||'inicio',e=items[selectedEvent];
  if(page==='evento'){
    const hero=document.querySelector('.detail-hero');
    /* Hero de detalle del evento elegido; el banner-concierto permanece en Inicio. */
    hero.style.backgroundImage=`linear-gradient(90deg,#16051ff2 0%,#16051fe8 29%,#16051fbd 49%,#16051f45 80%),url('../../../estilo/${e[5]}')`;
    const title=hero.querySelector('.detail-title');
    title.querySelector('h1').textContent=e[0];
    title.querySelector('small').lastChild.textContent=' '+e[0];
    title.querySelectorAll('.pill')[0].textContent=e[1];
    title.querySelectorAll('.pill')[1].textContent='Evento ilustrativo';
    title.querySelector('p').textContent=`${e[1]} en ${e[2]}. Explora esta experiencia en vivo y elige tus entradas de demostración.`;
    const meta=title.querySelectorAll('.row')[1].querySelectorAll('span');
    meta[0].innerHTML=`${svg('calendar')} ${escapeHtml(e[4])}<small>Hora por confirmar · demo</small>`;
    meta[1].innerHTML=`${svg('pin')} ${escapeHtml(e[3])}<small>${escapeHtml(e[2])}, Colombia</small>`;
    const sections=document.querySelectorAll('.detail-content .panel');
    sections[0].querySelector('p').textContent=`Experiencia de ${e[1].toLowerCase()} en ${e[2]}. Descripción ilustrativa; consulta los detalles reales con el organizador.`;
    sections[0].querySelector('.row').innerHTML=`<span class="pill">${e[1]}</span><span class="pill">${e[2]}</span>`;
    sections[1].querySelectorAll('p')[0].textContent=e[4];
    sections[1].querySelectorAll('p')[1].textContent='Hora por confirmar · demo';
    sections[1].querySelectorAll('p')[2].textContent=e[3]+', '+e[2];
    sections[2].querySelector('h2').textContent='Imágenes de experiencias relacionadas';
     /* El selector ya presenta nominal y cargo por boleta; no sobrescribirlo. */
    const grid=document.querySelector('.detail-content + .section .grid4');
    if(grid)grid.innerHTML=items.map((it,i)=>i===selectedEvent?'':card(it,i)).filter(Boolean).slice(0,4).join('');
  }
  if(['datos','pago','confirmacion'].includes(page)){
    document.querySelectorAll('.selected-event,.summary-event').forEach(el=>{
      el.querySelector('img')?.setAttribute('src','../../../estilo/'+e[5]);
      el.querySelector('h2,strong')?.replaceChildren(document.createTextNode(e[0]));
      if(el.classList.contains('selected-event')){
        const paragraphs=el.querySelectorAll('p');
        if(paragraphs[0]?.textContent.includes('Música, amigos'))paragraphs[0].textContent=`${e[1]} · ${e[2]} · evento ilustrativo`;
        const details=[...paragraphs].find(p=>p.textContent.includes('Parque Simón Bolívar'));
        if(details)details.innerHTML=`${svg('calendar')} ${escapeHtml(e[4])}<br>${svg('pin')} ${escapeHtml(e[3])}, ${escapeHtml(e[2])}`;
      }
      el.querySelectorAll('p,small').forEach(node=>{node.innerHTML=node.innerHTML.replaceAll('Festival Luz de Bogotá',escapeHtml(e[0])).replaceAll('Parque Simón Bolívar',escapeHtml(e[3])).replaceAll('Bogotá',escapeHtml(e[2])).replaceAll('18 de julio de 2026',escapeHtml(e[4])).replaceAll('18 de julio',escapeHtml(e[4]));});
      el.querySelectorAll('small').forEach(node=>node.innerHTML=node.innerHTML.replace(' · 18:00',' · hora por confirmar'));
    });
    if(page==='confirmacion')document.querySelectorAll('.confirmation-hero p,.fake-ticket small').forEach(el=>el.textContent=el.textContent.replaceAll('Festival Luz de Bogotá',e[0]).replaceAll('Bogotá',e[2]));
  }
};
/* Ajuste comercial del demo, sin precios fiscales finales ni flujo transaccional.
   Todas las muestras usan el porcentaje por defecto; el porcentaje por evento
   es configurable en producto, pero este demo no simula su configuración. */
const feeRate=.15;
const cop=n=>'COP '+new Intl.NumberFormat('es-CO').format(n);
const tiers=()=>{const base=Number(items[selectedEvent][6].replaceAll('.',''));return [base,base+60000,base+130000]};
const fee=n=>Math.round(n*feeRate);
const pricedCard=card;
card=(e,i)=>pricedCard(e,i).replace(/<p class="card-price">[\s\S]*?<\/p>/,`<p class="card-price">Desde <strong>${cop(Number(e[6].replaceAll('.','')))} por boleta</strong><br><small>Cargo de servicio por boleta: ${cop(fee(Number(e[6].replaceAll('.',''))))} + IVA sobre el cargo (15% por defecto)</small></p>`);
const pricedEvent=event;
event=()=>{
  let html=pricedEvent();const values=tiers();let index=0;
  html=html.replace(/<strong>\$ (?:120\.000|180\.000|250\.000) COP<\/strong>/g,()=>{const nominal=values[index++];return `<strong>${cop(nominal)} por boleta</strong><small>Cargo de servicio: ${cop(fee(nominal))} + IVA sobre el cargo (15% por defecto)</small>`});
  return html;
};
function summary(confirmed=false){
  const values=tiers(),labels=['General','Preferencial','Palco'];
  const selected=state.counts.map((count,i)=>count?`${count} × ${labels[i]}`:null).filter(Boolean).join(', ')||'Sin entradas';
  const nominal=state.counts.reduce((sum,count,i)=>sum+count*values[i],0);
  const charge=state.counts.reduce((sum,count,i)=>sum+count*fee(values[i]),0);
  const perTicket=state.counts.map((count,i)=>count?`<div class="summary-line"><span>${escapeHtml(labels[i])} · ${count} × ${cop(values[i])} nominal</span><strong>${cop(count*values[i])}</strong></div><div class="summary-line"><span>Cargo · ${escapeHtml(labels[i])} · ${count} × ${cop(fee(values[i]))} por boleta</span><strong>${cop(count*fee(values[i]))}</strong></div>`:'').join('');
  return `<aside><section class="panel"><div class="panel-title"><span class="icon">🛒</span><h2>Resumen de tu compra</h2></div><div class="summary-event">${img('evento-summer.jpg','Fotografía del evento')}<div><strong>Festival Luz de Bogotá</strong><small>▣ 18 de julio de 2026 · 18:00</small><small>♧ Bogotá, Colombia</small></div></div><div class="summary-line"><span>Entradas seleccionadas</span><strong>${selected}</strong></div>${perTicket}<div class="summary-line"><span>Subtotal nominal</span><strong>${cop(nominal)}</strong></div><div class="summary-line"><span>Cargo de servicio (15% por defecto, configurable por evento; por boleta)</span><strong>${cop(charge)}</strong></div><div class="pending">Subtotal antes de IVA: ${cop(nominal+charge)} + IVA sobre el cargo</div><p class="disclaimer">El IVA sobre el cargo está sujeto a definición y validación fiscal: no se calcula un total final sin tasa. Los costos de transacción/Mercado Pago, blockchain y demás se cubren desde el cargo de servicio; no hay recargo de pasarela separado sobre el nominal.</p>${!confirmed?`<a class="link" href="#evento">Editar selección →</a>`:'<p class="disclaimer">No se ha cobrado ningún importe.</p>'}</section><div class="notice"><strong>✉ Entradas por correo electrónico</strong>En un proceso real la entrega depende de pago y emisión confirmados. Este demo no envía correos.</div><div class="notice purple"><strong>♧ ¿Necesitas ayuda?</strong>Este flujo es solo una demostración visual.</div></aside>`;
}
function paymentForm(){return `<section class="panel"><div class="panel-title"><span class="icon">▤</span><div><h2>Método de pago</h2><small>Referencia visual del paso de pago; no se solicitan datos bancarios.</small></div></div><fieldset class="payment-methods"><legend>Tarjetas disponibles en V1 mediante Mercado Pago</legend><label class="method"><input type="radio" name="demo-card" value="credito" checked> Tarjeta de crédito · Mercado Pago</label><label class="method"><input type="radio" name="demo-card" value="debito"> Tarjeta de débito · Mercado Pago</label></fieldset><p>Esta elección es solo visual. El botón presenta una confirmación <strong>ficticia</strong>: no abre Mercado Pago, no crea una transacción y no emite boletas.</p><div class="notice purple"><strong>Cargo por boleta: 15% por defecto + IVA sobre el cargo</strong>Configurable por evento. Subtotal antes de IVA en el resumen; IVA sujeto a validación fiscal y total final sin calcular. Los costos de transacción/Mercado Pago, blockchain y demás se cubren desde el cargo, sin recargo de pasarela separado.</div><div class="row" style="margin-top:16px">${btn('← Editar datos','datos','')}<button class="btn primary" id="simulate-payment" type="button">Simular confirmación (sin pagar) →</button></div></section>`}
route();
</script>
