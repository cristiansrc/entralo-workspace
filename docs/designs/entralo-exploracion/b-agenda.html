<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entralo · B / Agenda</title><style>
/* Semilla propuesta (no oficial): 10 roles ink/muted/surface/canvas/line/accent/accent-ink/focus/danger/success; soft contextual. Escala 12/14/16/24/40; espaciado 4px; radios 8/16. */
:root{--ink:#24221f;--muted:#59544d;--surface:#fffdfa;--canvas:#f5f3ef;--line:#aba69d;--accent:#28584b;--accent-ink:#fff;--focus:#1554a0;--danger:#a32432;--success:#19643b;--soft:#e7ede3;color:var(--ink);background:var(--canvas);font-family:Georgia,"Times New Roman",serif}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:1px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px;cursor:pointer}button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.65;cursor:not-allowed}.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:system-ui,sans-serif;font-weight:700}.primary:hover:not(:disabled){background:#173e33}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:absolute;top:-100px;background:white;z-index:9;padding:12px}.skip:focus{top:8px}.frame{max-width:1100px;margin:auto;padding:0 24px}.topline{background:var(--ink);color:white;font:12px system-ui,sans-serif;letter-spacing:.12em;padding:8px 0}header{background:var(--surface);border-bottom:1px solid var(--line)}header .frame{display:flex;align-items:center;justify-content:space-between;min-height:80px;gap:16px;flex-wrap:wrap}.brand{font-size:40px;font-weight:700;letter-spacing:-.07em;text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{border:0;background:transparent;font:700 14px system-ui,sans-serif}.tools{border-bottom:1px solid var(--line);background:var(--soft);padding:10px 0;font:14px system-ui,sans-serif}.tools .frame{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tools select{padding:8px;border-radius:8px;min-height:44px;background:white;color:var(--ink);border:1px solid var(--ink)}main{min-height:78vh;padding-bottom:64px}.intro{border-bottom:1px solid var(--ink);padding:64px 0 48px;display:grid;grid-template-columns:1.7fr 1fr;gap:48px}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 24px;font-weight:400}h2{font-size:40px;line-height:1.1;letter-spacing:-.04em;font-weight:400;margin:16px 0}h3{font-size:24px;margin:8px 0}.intro p,.lead{font-size:24px;line-height:1.4}.muted{color:var(--muted)}.agenda{margin-top:32px}.event{display:grid;grid-template-columns:100px 1fr 160px;gap:24px;padding:24px 0;border-bottom:1px solid var(--line);align-items:center}.date{font:700 14px system-ui,sans-serif;color:var(--accent)}.date strong{display:block;font:400 40px Georgia,serif;color:var(--ink)}.event h3{font-size:32px;font-weight:400;margin:4px 0}.event p{margin:4px 0;color:var(--muted)}.event .meta{font:14px system-ui,sans-serif}.event .end{text-align:right}.event .end strong{display:block;margin-bottom:10px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,.75fr);gap:40px;margin:40px 0}.paper{background:var(--surface);padding:32px;border-top:4px solid var(--ink);min-width:0}.paper h1{font-size:clamp(40px,5vw,64px)}.paper p{line-height:1.55}.aside{align-self:start;position:sticky;top:16px}.row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font:14px system-ui,sans-serif}.row span:last-child{text-align:right}.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:20px 8px;cursor:pointer}.choice:has(input:checked){background:var(--soft);border-left:4px solid var(--accent)}.choice input{width:20px;height:20px;accent-color:var(--accent)}.stepper{display:flex;align-items:center;gap:16px;font:700 24px system-ui,sans-serif}.notice{background:var(--soft);padding:16px;border-left:4px solid var(--accent);font:14px/1.5 system-ui,sans-serif;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.crumb{font:14px system-ui,sans-serif;padding-top:24px}.field{display:block;font:700 14px system-ui,sans-serif;margin-top:20px}.field input{display:block;width:100%;min-height:48px;border:1px solid var(--ink);border-radius:8px;padding:12px;margin-top:8px;background:white}.error{color:var(--danger);font:700 14px system-ui,sans-serif;margin:4px 0}.state{max-width:780px;margin:72px auto;padding:40px;background:var(--surface);border-top:4px solid var(--accent)}.state p{font-size:24px}.skeleton{height:20px;background:#d9d5cd;border-radius:8px;margin:16px 0;width:70%}.skeleton:nth-child(2){width:42%}footer{border-top:1px solid var(--line);padding:24px 0;font:14px system-ui,sans-serif;color:var(--muted)}@media(max-width:720px){.frame{padding:0 16px}.intro,.layout{grid-template-columns:1fr;gap:16px}.intro{padding:36px 0}.event{grid-template-columns:64px 1fr;gap:12px}.event .end{grid-column:2;text-align:left}.event .end strong{display:inline-block;margin-right:16px}.event h3{font-size:24px}.date strong{font-size:32px}.paper{padding:20px}.aside{position:static}h2{font-size:32px}.state{padding:24px}}@media(max-width:360px){.tools select,.actions button{width:100%}}
</style></head><body><a href="#contenido" class="skip">Saltar al contenido</a><div class="topline"><div class="frame">ENTRALO / AGENDA CULTURAL · COLOMBIA</div></div><header><div class="frame"><a href="#inicio" class="brand" id="logo">entralo.</a><nav aria-label="Principal"><button data-go="inicio">Inicio</button><button data-go="catalogo">Agenda</button><button data-go="compra">Mi selección</button></nav></div></header><div class="tools"><div class="frame"><label for="estado">Probar estado de interfaz</label><select id="estado"><option value="normal">Normal</option><option value="vacio">Sin eventos</option><option value="cargando">Cargando</option><option value="error">Error de red</option><option value="parcial">Datos parciales</option><option value="permiso">Acceso requerido</option><option value="offline">Sin conexión</option></select><span>Propuesta B · Agenda · modo claro</span></div></div><main class="frame" id="contenido" tabindex="-1"></main><footer><div class="frame">Concepto visual no aprobado · Agenda ficticia gestionada por Entralo · Sin pagos reales</div></footer><script>
const items=[{title:'Voces del Caribe',day:'22',month:'NOV',date:'22 nov 2026',venue:'Cartagena · Explanada cultural',genre:'Festival',types:[['General',110000],['Preferencial',175000]]},{title:'Noches del Río',day:'18',month:'OCT',date:'18 oct 2026',venue:'Medellín · Teatro al aire libre',genre:'Música en vivo',types:[['General',89000],['Preferencial',145000]]},{title:'Ciudad en Movimiento',day:'07',month:'NOV',date:'7 nov 2026',venue:'Bogotá · Centro cultural',genre:'Danza',types:[['Platea',65000],['Balcón',82000]]}];let view='inicio',selected=0,type=0,qty=1,state='normal',name='',email='',touched={};const main=document.querySelector('main'),status=document.getElementById('estado'),item=()=>items[selected],money=n=>'$ '+new Intl.NumberFormat('es-CO').format(n)+' COP',safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(x,i)=>`<article class="event"><div class="date"><strong>${x.day}</strong>${x.month} 2026</div><div><span class="eyebrow">${x.genre}</span><h3>${x.title}</h3><p class="meta">${x.venue}</p></div><div class="end"><strong>Desde ${money(x.types[0][1])}</strong><button data-event="${i}">Ver programa →</button></div></article>`;const list=()=>`<div class="agenda">${items.map(row).join('')}</div>`;const crumb=()=>`<div class="crumb">Inicio / Agenda / ${item().title} / ${view==='checkout'?'Checkout':view==='compra'?'Compra':'Evento'}</div>`;const summary=()=>`<aside class="paper aside" aria-label="Resumen de compra"><span class="eyebrow">Selección / ${item().date}</span><h2>${item().title}</h2><p>${item().venue}</p><div class="row"><span>${qty} × ${item().types[type][0]}</span><strong>${money(qty*item().types[type][1])}</strong></div><div class="row"><span>Costo de servicio</span><strong>Por definir</strong></div><div class="row"><strong>Total a pagar</strong><strong>Por definir</strong></div><p class="muted">Importe y pagador del servicio pendientes. Pago no habilitado.</p></aside>`;
function normal(){if(view==='inicio')return `<div class="intro"><div><span class="eyebrow">Edición Colombia · 2026</span><h1>Una agenda para salir a vivir.</h1></div><div><p class="lead">Música, escena y encuentros. Descubre qué sucede cerca de ti, a tu ritmo.</p><button class="primary" data-go="catalogo">Consultar agenda →</button></div></div><section aria-label="Próximas fechas"><h2>Próximas fechas</h2>${list()}</section>`;if(view==='catalogo')return `<div class="intro"><div><span class="eyebrow">Cartelera pública</span><h1>La agenda completa.</h1></div><div><p class="lead">Fecha, ciudad y precio de la boleta a simple vista.</p><p class="muted">El costo de servicio aún no está definido.</p></div></div><section aria-label="Eventos publicados">${list()}</section>`;if(view==='detalle')return `${crumb()}<div class="layout"><section class="paper"><span class="eyebrow">${item().genre} · ${item().date}</span><h1>${item().title}</h1><p class="lead">${item().venue}</p><p>Un encuentro para compartir en vivo. Evento ilustrativo operado por Entralo; localidades con cupo, sin asientos numerados.</p><h2>Elige tu localidad</h2><fieldset style="border:0;padding:0"><legend class="eyebrow">Tipo de boleta</legend>${item().types.map((t,i)=>`<label class="choice"><span><input type="radio" name="tipo" value="${i}" ${type===i?'checked':''}> ${t[0]}</span><strong>${money(t[1])}</strong></label>`).join('')}</fieldset><p id="cantidad"><strong>Cantidad</strong> · límite configurable por evento, valor pendiente.</p><div class="stepper" role="group" aria-labelledby="cantidad"><button data-qty="-1" aria-label="Quitar una boleta" ${qty===1?'disabled':''}>−</button><span aria-live="polite">${qty}</span><button data-qty="1" aria-label="Añadir una boleta">+</button></div><div class="actions"><button class="primary" data-go="compra">Revisar compra</button><button data-go="catalogo">Volver a agenda</button></div></section>${summary()}</div>`;if(view==='compra')return `${crumb()}<div class="layout"><section class="paper"><span class="eyebrow">Compra · paso 1 de 2</span><h1>Todo en su lugar.</h1><p class="lead">${qty} ${qty===1?'boleta':'boletas'} para ${item().title}.</p><p>${item().types[type][0]} · ${item().date} · ${item().venue}</p><div class="notice">La reserva prevista dura <strong>20 minutos configurables</strong>. El inicio y la expiración operativa están pendientes; este prototipo no bloquea cupos.</div><div class="actions"><button class="primary" data-go="checkout">Ir a checkout</button><button data-go="detalle">Editar selección</button></div></section>${summary()}</div>`;return `${crumb()}<div class="layout"><section class="paper"><span class="eyebrow">Checkout · paso 2 de 2</span><h1>Antes del pago.</h1><p>Las compras reales requieren cuenta Entralo. Los datos de prueba no se guardan ni se envían.</p><form id="checkoutForm" novalidate><label class="field" for="nombre">Nombre completo *<input id="nombre" name="nombre" autocomplete="name" required value="${safe(name)}" aria-describedby="nombre-error" ${touched.nombre&&!name.trim()?'aria-invalid="true"':''}></label><div class="error" id="nombre-error">${touched.nombre&&!name.trim()?'Escribe tu nombre completo para continuar.':''}</div><label class="field" for="correo">Correo electrónico *<input id="correo" name="correo" type="email" autocomplete="email" inputmode="email" placeholder="nombre@ejemplo.com" required value="${safe(email)}" aria-describedby="correo-error" ${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'aria-invalid="true"':''}></label><div class="error" id="correo-error">${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'Escribe un correo válido, por ejemplo nombre@ejemplo.com.':''}</div><div class="notice">Mercado Pago · Colombia/COP. <strong>Pago no disponible:</strong> servicio y total por definir antes de cobrar.</div><button class="primary" disabled type="submit" aria-describedby="pago-ayuda">Pagar con Mercado Pago (pendiente)</button><p id="pago-ayuda" class="muted">Sin total calculable ni pasarela en este prototipo.</p></form><div class="actions"><button data-go="compra">Volver a compra</button></div></section>${summary()}</div>`}
const titles={vacio:'Hoy no hay eventos publicados.',cargando:'Estamos preparando la agenda.',error:'La agenda no se pudo cargar.',parcial:'Faltan algunas fechas.',permiso:'Tu cuenta es necesaria para comprar.',offline:'La agenda está sin conexión.'},details={vacio:'Vuelve luego para descubrir los próximos encuentros.',cargando:'Conservamos tu selección mientras cargan los eventos.',error:'No perdimos tu selección. Vuelve a intentar la carga.',parcial:'Puedes explorar los eventos disponibles; otros aún no se muestran.',permiso:'Para comprar necesitarás acceder a una cuenta Entralo. El acceso no forma parte de esta prueba.',offline:'Puedes revisar lo visto; para comprobar disponibilidad y pagar debes reconectar.'};function alternative(){return `<div class="state" ${state==='error'?'role="alert"':'role="status"'}><span class="eyebrow">Estado simulado · ${state}</span><h1>${titles[state]}</h1>${state==='cargando'?'<div class="skeleton"></div><div class="skeleton"></div>':''}<p>${details[state]}</p>${state==='parcial'?row(items[1],1):''}<div class="actions"><button class="primary" data-retry>${state==='error'||state==='offline'?'Reintentar carga':'Volver al flujo'}</button><button data-go="inicio">Ir a inicio</button></div></div>`}function render(){main.innerHTML=state==='normal'?normal():alternative();document.title='Entralo · B / '+view}document.addEventListener('click',ev=>{const t=ev.target.closest('[data-go],[data-event],[data-qty],[data-retry]');if(!t)return;if(t.hasAttribute('data-retry'))state=status.value='normal';else if(t.hasAttribute('data-event')){selected=+t.dataset.event;type=0;qty=1;view='detalle';state=status.value='normal'}else if(t.hasAttribute('data-qty'))qty=Math.max(1,qty+Number(t.dataset.qty));else{view=t.dataset.go;state=status.value='normal'}render();main.focus()});document.addEventListener('change',ev=>{if(ev.target===status){state=status.value;render();main.focus()}else if(ev.target.name==='tipo'){type=+ev.target.value;render()}});document.addEventListener('input',ev=>{if(ev.target.id==='nombre')name=ev.target.value;if(ev.target.id==='correo')email=ev.target.value});document.addEventListener('focusout',ev=>{if(['nombre','correo'].includes(ev.target.id)){let id=ev.target.id;touched[id]=true;let invalid=id==='nombre'?!name.trim():!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);ev.target.setAttribute('aria-invalid',String(invalid));document.getElementById(id+'-error').textContent=invalid?(id==='nombre'?'Escribe tu nombre completo para continuar.':'Escribe un correo válido, por ejemplo nombre@ejemplo.com.'):''}});document.addEventListener('submit',ev=>ev.preventDefault());document.getElementById('logo').addEventListener('click',ev=>{ev.preventDefault();view='inicio';state=status.value='normal';render();main.focus()});render();
</script></body></html>
