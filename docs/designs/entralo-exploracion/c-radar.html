<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entralo · C / Radar</title><style>
/* Semilla exploratoria, no tokens aprobados. 10 roles: ink/muted/surface/canvas/line/accent/accent-ink/focus/danger/success; soft contextual. Tipos 12/14/16/24/40; base 4px; radios 8/16. */
:root{--ink:#152a36;--muted:#435665;--surface:#fff;--canvas:#f3f7f8;--line:#9caeb7;--accent:#005a67;--accent-ink:#fff;--focus:#003fb5;--danger:#9f2830;--success:#155e39;--soft:#dcecef;background:var(--canvas);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:10px 16px;min-height:44px;font-weight:700}button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.65;cursor:not-allowed}.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.primary:hover:not(:disabled){background:#003e47}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:absolute;top:-100px;background:white;padding:12px;z-index:9}.skip:focus{top:8px}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--ink);color:#fff;padding:24px 16px}.brand{font-size:24px;font-weight:900;letter-spacing:-.05em;display:block;margin-bottom:40px;text-decoration:none}.brand i{font-style:normal;color:#95d7db}.sidebar nav{display:grid;gap:8px}.sidebar nav button{width:100%;text-align:left;border:1px solid #68838e;background:transparent;color:white}.sidebar nav button:hover{background:#2d4b58}.side-note{font-size:14px;line-height:1.5;border-top:1px solid #68838e;margin-top:32px;padding-top:24px}.workspace{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:16px 32px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.top strong{font-size:14px}.top label{font-size:14px;font-weight:700}.top select{background:white;color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:8px;min-height:44px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1280px;padding:32px;margin:auto;min-height:82vh}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--accent)}h1{font-size:40px;line-height:1.1;letter-spacing:-.04em;margin:8px 0 16px}h2{font-size:24px;line-height:1.2}h3{font-size:24px;line-height:1.2;margin:12px 0}p{line-height:1.5}.muted{color:var(--muted)}.banner{display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line);border-radius:16px;background:var(--ink);color:white;overflow:hidden;margin:24px 0}.banner>div:first-child{padding:40px}.banner h1{font-size:clamp(40px,4vw,56px)}.banner p{max-width:45ch}.banner .eyebrow{color:#ace6e7}.banner .primary{background:#b3f0de;color:#13363c;border-color:#b3f0de}.diagram{display:grid;place-items:center;min-height:260px;background:repeating-linear-gradient(45deg,#286378,#286378 24px,#337d8c 24px,#337d8c 48px);font-size:64px;color:#fff;font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) 320px;gap:20px;align-items:start}.tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.box{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:24px}.tile .date{font-weight:800;color:var(--accent);font-size:14px}.tile .type{display:inline-block;background:var(--soft);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800}.tile footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}.box{margin-bottom:12px}.box.sticky{position:sticky;top:16px}.box h2{margin:0 0 16px}.quick{display:grid;gap:12px}.quick div{border-left:4px solid var(--accent);padding:8px 12px;background:var(--soft)}.stack{display:grid;gap:12px}.choice{border:2px solid var(--line);padding:16px;border-radius:8px;display:flex;gap:12px;align-items:center;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}.choice input{width:20px;height:20px;accent-color:var(--accent)}.choice strong{display:block}.qty{display:flex;gap:12px;align-items:center}.qty span{font-size:24px;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}.row span:last-child{text-align:right}.notice{background:var(--soft);border-left:4px solid var(--accent);padding:16px;margin:20px 0;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.crumb{font-size:14px;padding-bottom:16px}.field{display:block;font-weight:700;font-size:14px;margin-top:16px}.field input{display:block;width:100%;min-height:48px;margin-top:8px;padding:12px;border:1px solid var(--ink);border-radius:8px;background:white}.error{color:var(--danger);font-size:14px;font-weight:700}.state{max-width:760px;background:white;padding:40px;border:1px solid var(--line);border-radius:16px;margin:48px auto}.skeleton{height:24px;width:70%;background:#c9dadd;border-radius:8px;margin:20px 0}.skeleton:nth-child(2){width:45%}.foot{font-size:14px;padding:24px 32px;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:850px){.shell{display:block}.sidebar{padding:12px 16px}.brand{margin:0 0 12px}.sidebar nav{display:flex;flex-wrap:wrap}.sidebar nav button{width:auto}.side-note{display:none}.top{padding:12px 16px}main{padding:24px 16px}.layout{grid-template-columns:1fr}.box.sticky{position:static}}@media(max-width:520px){.banner,.tile-grid{grid-template-columns:1fr}.banner>div:first-child{padding:24px}.diagram{min-height:160px;font-size:40px}.tile,.box,.state{padding:20px}.actions button{width:100%}}@media(max-width:360px){.top select{width:100%}}
</style></head><body><a class="skip" href="#contenido">Saltar al contenido</a><div class="shell"><aside class="sidebar"><a href="#inicio" class="brand" id="logo">entr<i>a</i>lo /</a><nav aria-label="Principal"><button data-go="inicio">⌂ &nbsp; Inicio</button><button data-go="catalogo">▦ &nbsp; Catálogo</button><button data-go="compra">◫ &nbsp; Mi selección</button></nav><p class="side-note">Experiencias en vivo<br>Colombia · COP<br>Operación de eventos: Entralo</p></aside><div class="workspace"><header class="top"><strong>EXPLORAR / EXPERIENCIAS</strong><div class="toolbar"><label for="estado">Probar estado de interfaz</label><select id="estado"><option value="normal">Normal</option><option value="vacio">Sin eventos</option><option value="cargando">Cargando</option><option value="error">Error de red</option><option value="parcial">Datos parciales</option><option value="permiso">Acceso requerido</option><option value="offline">Sin conexión</option></select><span class="muted">C · Radar · claro</span></div></header><main id="contenido" tabindex="-1"></main><footer class="foot">Entralo · Propuesta exploratoria · Datos ficticios · Sin cobros reales</footer></div></div><script>
const items=[{name:'Ciudad en Movimiento',date:'07 NOV 2026',place:'Bogotá · Centro cultural',genre:'Danza',types:[['Platea',65000],['Balcón',82000]]},{name:'Noches del Río',date:'18 OCT 2026',place:'Medellín · Teatro al aire libre',genre:'Música en vivo',types:[['General',89000],['Preferencial',145000]]},{name:'Voces del Caribe',date:'22 NOV 2026',place:'Cartagena · Explanada cultural',genre:'Festival',types:[['General',110000],['Preferencial',175000]]}];let view='inicio',selected=0,type=0,qty=1,state='normal',name='',email='',touched={};const main=document.querySelector('main'),select=document.getElementById('estado'),item=()=>items[selected],money=n=>'$ '+new Intl.NumberFormat('es-CO').format(n)+' COP',safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tile=(x,i)=>`<article class="tile"><span class="type">${x.genre}</span><h3>${x.name}</h3><p class="date">${x.date}</p><p class="muted">${x.place}</p><footer><strong>Desde ${money(x.types[0][1])}</strong><button data-event="${i}">Elegir evento</button></footer></article>`;const listing=()=>`<div class="tile-grid">${items.map(tile).join('')}</div>`;const sideInfo=()=>`<aside class="box"><span class="eyebrow">A la vista</span><h2>Lo esencial</h2><div class="quick"><div>Localidades con cupo, sin asiento numerado.</div><div>Precio de boleta visible en COP.</div><div>Cargo y total del pago: pendientes.</div></div></aside>`;const summary=()=>`<aside class="box sticky" aria-label="Resumen de compra"><span class="eyebrow">Resumen persistente</span><h2>${item().name}</h2><p>${item().date}<br>${item().place}</p><div class="row"><span>${qty} × ${item().types[type][0]}</span><strong>${money(qty*item().types[type][1])}</strong></div><div class="row"><span>Costo de servicio</span><strong>Por definir</strong></div><div class="row"><strong>Total a pagar</strong><strong>Por definir</strong></div><p class="muted">Pagador, importe y cálculo por definir. No se permite pago todavía.</p></aside>`;const crumb=()=>`<div class="crumb">Inicio / Catálogo / ${item().name} / ${view==='checkout'?'Checkout':view==='compra'?'Compra':'Evento'}</div>`;
function normal(){if(view==='inicio')return `<section class="banner"><div><span class="eyebrow">Temporada en vivo / Colombia</span><h1>Encuentra tu próximo plan.</h1><p>Una vista rápida para elegir lo que importa: fecha, ciudad, localidad y precio.</p><button class="primary" data-go="catalogo">Ver todos los eventos →</button></div><div class="diagram" aria-hidden="true">↗ ↗ ↗</div></section><div class="layout"><section><span class="eyebrow">Selección actual</span><h2>Próximos encuentros</h2>${listing()}</section>${sideInfo()}</div>`;if(view==='catalogo')return `<section><span class="eyebrow">Cartelera / Publicados</span><h1>Explora eventos</h1><p class="muted">Comparación rápida · disponibilidad de cupos sujeta a confirmación.</p><div class="layout"><div>${listing()}</div>${sideInfo()}</div></section>`;if(view==='detalle')return `${crumb()}<div class="layout"><section class="stack"><div class="box"><span class="eyebrow">${item().genre} / ${item().date}</span><h1>${item().name}</h1><p>${item().place}. Evento ilustrativo gestionado por Entralo.</p></div><div class="box"><h2>Selecciona localidad y tipo</h2><fieldset style="border:0;padding:0"><legend class="eyebrow">Boletas con cupo</legend><div class="stack">${item().types.map((t,i)=>`<label class="choice"><input type="radio" name="tipo" value="${i}" ${type===i?'checked':''}><span><strong>${t[0]}</strong>${money(t[1])}</span></label>`).join('')}</div></fieldset><p id="cantidad"><strong>Cantidad</strong> · límite configurable, valor aún pendiente.</p><div class="qty" role="group" aria-labelledby="cantidad"><button data-qty="-1" aria-label="Quitar una boleta" ${qty===1?'disabled':''}>−</button><span aria-live="polite">${qty}</span><button data-qty="1" aria-label="Añadir una boleta">+</button></div><div class="actions"><button class="primary" data-go="compra">Revisar compra →</button><button data-go="catalogo">Volver al catálogo</button></div></div></section>${summary()}</div>`;if(view==='compra')return `${crumb()}<div class="layout"><section class="box"><span class="eyebrow">01 / Compra</span><h1>Revisa tu selección</h1><p><strong>${item().name}</strong> · ${item().types[type][0]} · ${qty} ${qty===1?'boleta':'boletas'}</p><p>${item().date} · ${item().place}</p><div class="notice">Reserva prevista de <strong>20 minutos configurables</strong>. Inicio y efectos al vencer pendientes. Este prototipo no reserva inventario real.</div><div class="actions"><button class="primary" data-go="checkout">Continuar a checkout</button><button data-go="detalle">Editar selección</button></div></section>${summary()}</div>`;return `${crumb()}<div class="layout"><section class="box"><span class="eyebrow">02 / Checkout</span><h1>Datos y pago</h1><p>Compra real sujeta a cuenta Entralo. Formulario visual sin almacenamiento ni envío.</p><form id="checkoutForm" novalidate><label for="nombre" class="field">Nombre completo *<input id="nombre" name="nombre" autocomplete="name" required value="${safe(name)}" aria-describedby="nombre-error" ${touched.nombre&&!name.trim()?'aria-invalid="true"':''}></label><div id="nombre-error" class="error">${touched.nombre&&!name.trim()?'Escribe tu nombre completo para continuar.':''}</div><label for="correo" class="field">Correo electrónico *<input id="correo" name="correo" type="email" inputmode="email" autocomplete="email" required placeholder="nombre@ejemplo.com" value="${safe(email)}" aria-describedby="correo-error" ${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'aria-invalid="true"':''}></label><div id="correo-error" class="error">${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'Escribe un correo válido, por ejemplo nombre@ejemplo.com.':''}</div><div class="notice">Mercado Pago · Colombia / COP. Antes del cobro debe informarse el importe de servicio y total.</div><button type="submit" class="primary" disabled aria-describedby="pago-ayuda">Pagar con Mercado Pago (pendiente)</button><p class="muted" id="pago-ayuda">No hay pasarela conectada ni total determinable en este concepto.</p></form><div class="actions"><button data-go="compra">Volver a compra</button></div></section>${summary()}</div>`}
const titles={vacio:'No hay eventos publicados',cargando:'Cargando cartelera',error:'No pudimos cargar la cartelera',parcial:'Catálogo parcialmente disponible',permiso:'Acceso a cuenta requerido',offline:'No hay conexión'},details={vacio:'Vuelve más tarde: Entralo publicará nuevas experiencias.',cargando:'Tu selección se conserva mientras intentamos cargar los eventos.',error:'Conservamos tu selección. Intenta cargar de nuevo.',parcial:'Puedes ver los eventos disponibles; parte de la cartelera no ha cargado.',permiso:'Para comprar y consultar boletas necesitarás entrar a tu cuenta. Este acceso no está implementado.',offline:'Puedes revisar el contenido visible; para confirmar cupos y pagar hace falta conexión.'};function alternative(){return `<div class="state" ${state==='error'?'role="alert"':'role="status"'}><span class="eyebrow">Estado simulado / ${state}</span><h1>${titles[state]}</h1>${state==='cargando'?'<div class="skeleton"></div><div class="skeleton"></div>':''}<p>${details[state]}</p>${state==='parcial'?tile(items[0],0):''}<div class="actions"><button class="primary" data-retry>${state==='error'||state==='offline'?'Reintentar carga':'Volver al flujo'}</button><button data-go="inicio">Ir a inicio</button></div></div>`}function render(){main.innerHTML=state==='normal'?normal():alternative();document.title='Entralo · C / '+view}document.addEventListener('click',ev=>{let t=ev.target.closest('[data-go],[data-event],[data-qty],[data-retry]');if(!t)return;if(t.hasAttribute('data-retry'))state=select.value='normal';else if(t.hasAttribute('data-event')){selected=+t.dataset.event;type=0;qty=1;view='detalle';state=select.value='normal'}else if(t.hasAttribute('data-qty'))qty=Math.max(1,qty+Number(t.dataset.qty));else {view=t.dataset.go;state=select.value='normal'}render();main.focus()});document.addEventListener('change',ev=>{if(ev.target===select){state=select.value;render();main.focus()}else if(ev.target.name==='tipo'){type=+ev.target.value;render()}});document.addEventListener('input',ev=>{if(ev.target.id==='nombre')name=ev.target.value;if(ev.target.id==='correo')email=ev.target.value});document.addEventListener('focusout',ev=>{if(['nombre','correo'].includes(ev.target.id)){const id=ev.target.id;touched[id]=true;let invalid=id==='nombre'?!name.trim():!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);ev.target.setAttribute('aria-invalid',String(invalid));document.getElementById(id+'-error').textContent=invalid?(id==='nombre'?'Escribe tu nombre completo para continuar.':'Escribe un correo válido, por ejemplo nombre@ejemplo.com.'):''}});document.addEventListener('submit',ev=>ev.preventDefault());document.getElementById('logo').addEventListener('click',ev=>{ev.preventDefault();view='inicio';state=select.value='normal';render();main.focus()});render();
</script></body></html>
