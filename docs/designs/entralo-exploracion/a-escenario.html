<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entralo · A / Escenario</title>
<style>
/* SEMILLA PROPUESTA, no tokens aprobados. Roles (10): ink, muted, surface, canvas, line, accent, accent-ink, focus, danger, success; soft es fondo contextual. Escala 12/14/16/24/40; paso 4px; radios 8/16. */
:root{--ink:#171827;--muted:#51536a;--surface:#fff;--canvas:#f5f3ef;--line:#aaadba;--accent:#6321b2;--accent-ink:#fff;--focus:#193ea0;--danger:#a32432;--success:#135936;--soft:#e9e2f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border-radius:8px;border:1px solid var(--ink);padding:10px 20px;background:var(--surface);color:var(--ink);font-weight:700}button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.65;cursor:not-allowed}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:absolute;top:-100px;background:#fff;padding:12px;z-index:9}.skip:focus{top:8px}.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.primary:hover:not(:disabled){background:#471583}.frame{max-width:1220px;margin:auto;padding:0 24px}header{background:var(--surface);border-bottom:1px solid var(--line)}header .frame{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap}.brand{font-weight:900;font-size:24px;text-decoration:none;letter-spacing:-1px}.brand span{color:var(--accent)}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav button{border:none;background:transparent}.tools{background:#edeaf1;border-bottom:1px solid var(--line);padding:12px 0}.tools .frame{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools select{min-height:44px;border:1px solid var(--ink);border-radius:8px;padding:8px;background:white;color:var(--ink)}main{min-height:75vh;padding-bottom:56px}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:800}.hero{margin:24px 0 48px;background:#241438;color:#fff;border-radius:16px;min-height:430px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.hero-copy{padding:56px;display:flex;flex-direction:column;align-items:start;justify-content:center;gap:20px}.hero h1{font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.05em;margin:0}.hero p{font-size:16px;max-width:44ch;line-height:1.6}.hero .primary{background:#ffe279;color:#241438;border-color:#ffe279}.art{background:radial-gradient(circle at 50% 36%,#ffd579 0 7%,#bf5cf2 8% 17%,#623183 18% 33%,#321849 34% 60%,#241438 61%);display:flex;align-items:end;justify-content:center;padding:24px;font-size:clamp(40px,7vw,100px);text-align:center;letter-spacing:-.07em;font-weight:900}.section-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:48px 0 20px}.section-title h1,.section-title h2{font-size:40px;line-height:1.1;letter-spacing:-.04em;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.poster{height:195px;display:flex;align-items:end;padding:24px;color:#fff;font-size:24px;font-weight:900;line-height:1.1}.poster.one{background:linear-gradient(145deg,#23144d,#a32677 62%,#ffad5c)}.poster.two{background:linear-gradient(145deg,#063b45,#147582 62%,#eab95e)}.poster.three{background:linear-gradient(145deg,#332833,#a6534c 62%,#efa77a)}.card-body{padding:24px}.card h3{font-size:24px;margin:8px 0}.card p{line-height:1.5}.tag{display:inline-block;background:var(--soft);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:800}.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,.8fr);gap:24px;margin:32px 0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px}.panel h1{font-size:40px;line-height:1.1;margin:12px 0}.panel h2{font-size:24px}.panel p{line-height:1.6}.line{border-top:1px solid var(--line);padding:16px 0}.choice{display:block;padding:16px;border:2px solid var(--line);border-radius:8px;margin:12px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}.choice input{width:20px;height:20px;vertical-align:middle;accent-color:var(--accent)}.choice strong{display:inline-block;margin-left:8px}.choice small{display:block;margin:8px 0 0 32px;color:var(--muted)}.stepper{display:flex;align-items:center;gap:12px}.stepper span{font-size:24px;font-weight:800;min-width:28px;text-align:center}.summary{position:sticky;top:16px;align-self:start}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row span:last-child{text-align:right}.notice{background:var(--soft);border-left:4px solid var(--accent);padding:16px;margin:16px 0;line-height:1.5}.error{color:var(--danger);font-size:14px;font-weight:700}.field{display:block;font-weight:700;margin:20px 0}.field input{display:block;width:100%;min-height:48px;border:1px solid var(--ink);border-radius:8px;padding:12px;margin-top:8px;background:white}.state{max-width:760px;margin:72px auto;background:white;padding:40px;border:1px solid var(--line);border-radius:16px}.state h1{font-size:40px}.skeleton{background:#d8d4dd;height:24px;width:72%;margin:20px 0;border-radius:8px}.skeleton:nth-child(2){width:45%}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.crumb{padding-top:20px;font-size:14px} @media(max-width:740px){.frame{padding:0 16px}header .frame{padding-top:12px;padding-bottom:12px}.hero{grid-template-columns:1fr;min-height:0}.hero-copy{padding:32px}.art{min-height:220px}.grid,.split{grid-template-columns:1fr}.section-title h1,.section-title h2,.panel h1,.state h1{font-size:32px}.panel{padding:20px}.summary{position:static}.card .poster{height:150px}}@media(max-width:360px){.tools select{width:100%}.actions button{width:100%}}
</style></head><body><a class="skip" href="#contenido">Saltar al contenido</a><header><div class="frame"><a class="brand" href="#inicio" id="logo">entr<span>a</span>lo</a><nav aria-label="Principal"><button data-go="inicio">Inicio</button><button data-go="catalogo">Catálogo</button><button data-go="compra">Mi selección</button></nav></div></header><div class="tools"><div class="frame"><label for="estado">Probar estado de interfaz</label><select id="estado"><option value="normal">Normal</option><option value="vacio">Sin eventos</option><option value="cargando">Cargando</option><option value="error">Error de red</option><option value="parcial">Datos parciales</option><option value="permiso">Acceso requerido</option><option value="offline">Sin conexión</option></select><span class="muted">Propuesta A · Escenario · modo claro</span></div></div><main id="contenido" class="frame" tabindex="-1"></main><footer><div class="frame">Entralo · Concepto visual no aprobado · Eventos ficticios en Colombia · Sin pagos reales</div></footer><script>
const events=[{name:'Noches del Río',kind:'Música en vivo',date:'18 oct 2026',place:'Medellín · Teatro al aire libre',price:89000,poster:'one',types:[['General',89000],['Preferencial',145000]]},{name:'Ciudad en Movimiento',kind:'Danza',date:'7 nov 2026',place:'Bogotá · Centro cultural',price:65000,poster:'two',types:[['Platea',65000],['Balcón',82000]]},{name:'Voces del Caribe',kind:'Festival',date:'22 nov 2026',place:'Cartagena · Explanada cultural',price:110000,poster:'three',types:[['General',110000],['Preferencial',175000]]}];let view='inicio',selected=0,type=0,qty=1,state='normal',name='',email='',touched={};const main=document.querySelector('main'),status=document.querySelector('#estado');const money=n=>'$ '+new Intl.NumberFormat('es-CO').format(n)+' COP';const e=()=>events[selected];const price=()=>e().types[type][1];const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const crumb=()=>`<div class="crumb">Inicio / Catálogo / ${safe(e().name)} / ${view==='checkout'?'Checkout':view==='compra'?'Compra':'Evento'}</div>`;const card=(ev,i)=>`<article class="card"><div class="poster ${ev.poster}" aria-hidden="true">${ev.name}</div><div class="card-body"><span class="tag">${ev.kind}</span><h3>${ev.name}</h3><p>${ev.date}<br>${ev.place}</p><p>Desde <strong>${money(ev.price)}</strong></p><button class="primary" data-event="${i}">Ver evento</button></div></article>`;const summary=()=>`<aside class="panel summary" aria-label="Resumen de compra"><span class="kicker">Tu selección</span><h2>${e().name}</h2><p>${e().date}<br>${e().place}</p><div class="row"><span>${qty} × ${e().types[type][0]}</span><strong>${money(price()*qty)}</strong></div><div class="row"><span>Costo de servicio</span><strong>Por definir</strong></div><div class="row"><strong>Total a pagar</strong><strong>Por definir</strong></div><p class="muted">Modelo, pagador e importe del servicio pendientes. No se puede confirmar el pago hasta conocer el total.</p></aside>`;
function normal(){if(view==='inicio')return `<section class="hero"><div class="hero-copy"><span class="kicker">Momentos que se viven</span><h1>La ciudad suena mejor en vivo.</h1><p>Encuentra tu próxima experiencia en Colombia. Entralo gestiona la oferta de cada evento.</p><button class="primary" data-go="catalogo">Explorar eventos →</button></div><div class="art" aria-hidden="true">EN VIVO<br>↗</div></section><section><div class="section-title"><div><span class="kicker">En cartelera</span><h2>Encuentros que vienen</h2></div><button data-go="catalogo">Ver catálogo</button></div><div class="grid">${events.map(card).join('')}</div></section>`;
if(view==='catalogo')return `<section><div class="section-title"><div><span class="kicker">Colombia / Agenda</span><h1>Elige tu próxima historia.</h1><p class="muted">Explora eventos publicados; precios de boleta desde, sin costo de servicio definido.</p></div></div><div class="grid">${events.map(card).join('')}</div></section>`;
if(view==='detalle')return `${crumb()}<div class="split"><section class="panel"><span class="kicker">${e().kind} · ${e().date}</span><h1>${e().name}</h1><p>${e().place}. Localidades con cupo; no se asignan asientos numerados.</p><div class="poster ${e().poster}" style="border-radius:8px;min-height:240px" aria-hidden="true">${e().name}</div><h2>Selecciona tus boletas</h2><fieldset style="border:0;padding:0"><legend class="kicker">Localidad / tipo de boleta</legend>${e().types.map((t,i)=>`<label class="choice"><input type="radio" name="tipo" value="${i}" ${i===type?'checked':''}><strong>${t[0]}</strong> · ${money(t[1])}<small>Localidad con cupo · disponibilidad sujeta a confirmación</small></label>`).join('')}</fieldset><p id="cant-label"><strong>Cantidad de boletas</strong> · sujeto al límite configurable del evento</p><div class="stepper" role="group" aria-labelledby="cant-label"><button data-qty="-1" aria-label="Quitar una boleta" ${qty===1?'disabled':''}>−</button><span aria-live="polite">${qty}</span><button data-qty="1" aria-label="Añadir una boleta">+</button></div><div class="actions"><button class="primary" data-go="compra">Revisar compra →</button><button data-go="catalogo">Volver al catálogo</button></div></section>${summary()}</div>`;
if(view==='compra')return `${crumb()}<div class="split"><section class="panel"><span class="kicker">Paso 1 / 2</span><h1>Antes de continuar.</h1><p>Comprueba tu evento, localidad y cantidad. Este prototipo no reserva cupo real.</p><div class="notice">La reserva de cupo prevista es de <strong>20 minutos configurables</strong>. Su inicio y comportamiento al vencer están pendientes de definición.</div><h2>${e().name}</h2><p>${e().types[type][0]} · ${qty} ${qty===1?'boleta':'boletas'} · ${e().place}</p><div class="actions"><button class="primary" data-go="checkout">Ir a checkout →</button><button data-go="detalle">Cambiar selección</button></div></section>${summary()}</div>`;
return `${crumb()}<div class="split"><section class="panel"><span class="kicker">Paso 2 / 2</span><h1>Datos para tu compra.</h1><p>Vista exploratoria: las compras reales requieren cuenta Entralo. Aquí no se procesa ni se guarda información.</p><form id="checkoutForm" novalidate><label class="field" for="nombre">Nombre completo <span aria-hidden="true">*</span><input id="nombre" name="nombre" autocomplete="name" required value="${safe(name)}" aria-describedby="nombre-error" ${touched.nombre&&!name.trim()?'aria-invalid="true"':''}></label><div id="nombre-error" class="error">${touched.nombre&&!name.trim()?'Escribe tu nombre completo para continuar.':''}</div><label class="field" for="correo">Correo electrónico <span aria-hidden="true">*</span><input id="correo" name="correo" type="email" autocomplete="email" inputmode="email" required placeholder="nombre@ejemplo.com" value="${safe(email)}" aria-describedby="correo-error" ${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'aria-invalid="true"':''}></label><div id="correo-error" class="error">${touched.correo&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'Escribe un correo válido, por ejemplo nombre@ejemplo.com.':''}</div><div class="notice">Pago previsto con Mercado Pago · Colombia / COP. <strong>Pago no disponible:</strong> primero debe definirse y comunicarse el costo de servicio y el total final.</div><button class="primary" type="submit" disabled aria-describedby="pago-ayuda">Pagar con Mercado Pago (pendiente)</button><p id="pago-ayuda" class="muted">Prototipo sin pasarela ni total calculable; no se efectúan cobros.</p></form><div class="actions"><button data-go="compra">Volver a compra</button></div></section>${summary()}</div>`}
function alternative(){const titles={vacio:'No hay eventos para mostrar',cargando:'Buscando experiencias…',error:'No pudimos cargar los eventos',parcial:'Algunos eventos no están disponibles',permiso:'Necesitas tu cuenta Entralo',offline:'Estás sin conexión'};const texts={vacio:'Vuelve más tarde para conocer la próxima programación gestionada por Entralo.',cargando:'Estamos preparando la cartelera. Tu selección se mantiene.',error:'Tu selección está guardada en esta demostración. Prueba cargar de nuevo.',parcial:'Mostramos los eventos que sí están disponibles. Otros podrían aparecer después.',permiso:'Para comprar y consultar tus boletas necesitas entrar a tu cuenta. El acceso aún no está diseñado.',offline:'Podrás revisar esta selección; para confirmar disponibilidad y pagar necesitarás conexión.'};return `<section class="state" ${state==='error'?'role="alert"':'role="status"'}><span class="kicker">Estado simulado · ${state}</span><h1>${titles[state]}</h1>${state==='cargando'?'<div class="skeleton"></div><div class="skeleton"></div>':''}<p>${texts[state]}</p>${state==='parcial'?`<div class="grid" style="grid-template-columns:1fr">${card(events[0],0)}</div>`:''}<div class="actions"><button class="primary" data-retry> ${state==='error'||state==='offline'?'Reintentar carga':'Volver al flujo'}</button><button data-go="inicio">Ir a inicio</button></div></section>`}
function render(){main.innerHTML=state==='normal'?normal():alternative();document.title=`Entralo · A / ${view}`;}
document.addEventListener('click',ev=>{let t=ev.target.closest('[data-go],[data-event],[data-qty],[data-retry]');if(!t)return;if(t.hasAttribute('data-retry')){state=status.value='normal'}else if(t.hasAttribute('data-event')){selected=+t.dataset.event;type=0;qty=1;view='detalle';state=status.value='normal'}else if(t.hasAttribute('data-qty'))qty=Math.max(1,qty+Number(t.dataset.qty));else {view=t.dataset.go;if(view==='compra'&&!events[selected])view='catalogo';state=status.value='normal'}render();main.focus()});document.addEventListener('change',ev=>{if(ev.target===status){state=status.value;render();main.focus()}else if(ev.target.name==='tipo'){type=Number(ev.target.value);render()}});document.addEventListener('input',ev=>{if(ev.target.id==='nombre')name=ev.target.value;if(ev.target.id==='correo')email=ev.target.value});document.addEventListener('focusout',ev=>{if(['nombre','correo'].includes(ev.target.id)){touched[ev.target.id]=true;const id=ev.target.id,invalid=id==='nombre'?!name.trim():!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);ev.target.setAttribute('aria-invalid',String(invalid));document.getElementById(id+'-error').textContent=invalid?(id==='nombre'?'Escribe tu nombre completo para continuar.':'Escribe un correo válido, por ejemplo nombre@ejemplo.com.') :''}});document.addEventListener('submit',ev=>{if(ev.target.id==='checkoutForm'){ev.preventDefault();document.getElementById('pago-ayuda').textContent='Pago no disponible: falta definir el costo de servicio y el total final.'}});document.getElementById('logo').addEventListener('click',ev=>{ev.preventDefault();view='inicio';state=status.value='normal';render();main.focus()});render();
</script></body></html>
