openapi: 3.1.0
info:
  title: Entralo V1 componentes comunes documentales
  version: 1.0.0
  description: 'Lifecycle planning. No servicio desplegable. Referencias compartidas de contratos, no modelos de dominio. Reglas transversales en Master Spec e integration-contract.'
servers: [{url: 'https://componentes.entralo.invalid', description: 'Componentes documentales; no servicio desplegado.'}]
x-http-contract: {timeout_seconds: 3, connect_timeout_seconds: 1, read_max_attempts: 2, read_total_budget_seconds: 3, mutation_retry: same-key-only, caching: no-store, public_cache_seconds: 0, sensitive_body_logging: forbidden, error_contract: ApiErrorResponse, origin_policy: not-applicable, principal_validation: owner-validated}
paths: {}
x-error-codes:
  registry_version: 1
  policy: 'Registro cerrado. HTTP status debe coincidir con status y con statuses del código. owner/operations restringen códigos específicos; códigos generales aplican sólo a responses HTTP declaradas. BFF conserva código/status del owner, no crea traducciones. failure_code de OperationReceipt usa códigos operation-only. Agregar o cambiar semántica requiere delta/version de registry; nunca reciclar un código.'
  codes:
    VALIDATION_ERROR: {statuses: [400], meaning: 'Tipos, formato, parámetros o campos no permitidos; incluye unknown webhook schema.'}
    INVALID_REQUEST_BODY: {statuses: [400], meaning: 'JSON malformado o body ausente.'}
    WEBHOOK_ID_MISMATCH: {statuses: [400], owner: payments, operations: [receiveMercadoPagoNotification], meaning: 'data.id de query y body diferentes.'}
    AUTHENTICATION_REQUIRED: {statuses: [401], meaning: 'Credencial requerida ausente.'}
    TOKEN_INVALID: {statuses: [401], meaning: 'Credencial, firma o token inválido/expirado.'}
    ACCESS_DENIED: {statuses: [403], meaning: 'Principal autenticado sin permiso actual.'}
    RESOURCE_NOT_FOUND: {statuses: [404], meaning: 'Recurso inexistente o fuera de alcance; sin filtrar existencia.'}
    IDEMPOTENCY_CONFLICT: {statuses: [409], meaning: 'Misma clave durable con contenido distinto; webhook sólo mismo inbox ID con payload hash diferente.'}
    STATE_CONFLICT: {statuses: [409], meaning: 'Estado actual impide operación.'}
    VERSION_CONFLICT: {statuses: [409], meaning: 'Versiones de proyección/negocio incompatibles; no mismatch If-Match.'}
    CONTROL_PREPARATION_IN_PROGRESS: {statuses: [409], owner: catalog, operations: [requestEventControl], propagated_by: [admin-bff], meaning: 'Otra intención PREPARING concurrente ya existe; N2 existente, no nueva regla.'}
    STOCK_UNAVAILABLE: {statuses: [409], owner: purchases, operations: [reserveTickets], meaning: 'Cupo insuficiente.'}
    ACCOUNT_EVENT_LIMIT: {statuses: [409], owner: purchases, operations: [reserveTickets], meaning: 'Límite vigente cuenta/evento excedido.'}
    SALE_CLOSED: {statuses: [409], owner: purchases, operations: [reserveTickets, claimPaymentStart], meaning: 'Gate de venta cerrado.'}
    OFFER_STALE: {statuses: [409], owner: purchases, operations: [reserveTickets, estimateAppliedOfferPrice], propagated_by: [catalog, admin-bff, buyer-bff], meaning: 'Oferta solicitada no coincide con aplicada.'}
    ISSUANCE_CLOSED: {statuses: [409], owner: ticketing, operations: [issueAcceptedSaleTickets], meaning: 'Guard de emisión terminal cerrado.'}
    ADJUSTMENT_NOT_FOUND: {statuses: [409], owner: purchases, operations: [requestOwnRefund], meaning: 'Referencia de mapping de ajuste no disponible; no 404 del recurso orden.'}
    ADJUSTMENT_SCOPE_CONFLICT: {statuses: [409], owner: purchases, operations: [createRefundAdjustment, requestOwnRefund], meaning: 'Membresía, snapshot o alcance incompatibles.'}
    REFUND_AMOUNT_CONFLICT: {statuses: [409], owner: purchases, operations: [createRefundAdjustment, requestOwnRefund, decideRefundRequest], meaning: 'Claims solapados, remanente cero o límites financieros excedidos.'}
    BUSINESS_RULE_VIOLATION: {statuses: [422], meaning: 'Validación semántica de negocio; no cambia política aprobada.'}
    REFUND_NOT_ELIGIBLE: {statuses: [422], owner: purchases, operations: [createRefundAdjustment, requestOwnRefund, decideRefundRequest], meaning: 'No cumple política R05/R07 actual.'}
    PRECONDITION_FAILED: {statuses: [412], meaning: 'If-Match no coincide con versión vigente.'}
    PRECONDITION_REQUIRED: {statuses: [428], meaning: 'If-Match obligatorio ausente.'}
    RATE_LIMITED: {statuses: [429], meaning: 'Rate limit; Retry-After obligatorio.'}
    INTERNAL_ERROR: {statuses: [500], meaning: 'Fallo inesperado sanitizado.'}
    DEPENDENCY_UNAVAILABLE: {statuses: [503], meaning: 'Dependencia o transporte no disponible, sin resultado ficticio.'}
    VERIFICACION_NO_DISPONIBLE: {statuses: [503], owner: ticketing, operations: [readBoundedVerification], propagated_by: [buyer-bff], meaning: 'VerificationUnavailable; last_known informativo, no autorización.'}
    CONTROL_SUPERSEDED: {statuses: [], usage: operation-only, meaning: 'failure_code de control sustituido; no error HTTP de lectura.'}
components:
  headers:
    NoStore:
      required: true
      schema: {type: string, const: no-store}
      description: 'Obligatorio en owner y canal; prohíbe almacenamiento browser/CDN/BFF/proxy de payload sensible.'
    NoReferrer:
      required: true
      schema: {type: string, const: no-referrer}
      description: 'No transmitir identificadores ni accesos privados por Referer.'
    EventETag:
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      description: 'Versión de event, exactamente event_version entre comillas; usar en If-Match, no offer_version.'
  securitySchemes:
    Workload:
      type: apiKey
      in: header
      name: Authorization
      description: 'AWS SigV4 IAM en Gateway REST, no API key estática. Público sin sesión aún requiere workload canal. Policies por owner/ruta.'
    Cognito:
      type: apiKey
      in: header
      name: X-User-Access-Token
      description: 'Access JWT Cognito: firma, issuer, exp, token_use=access, client_id/scopes allowlist. No header enviado arbitrariamente por browser.'
    Principal:
      type: apiKey
      in: header
      name: X-Entralo-Principal
      description: 'Aserción BFF existente ligada al token hash, issuer/sub/user_id/mapping_version/audience/exp <=60s. No grant nuevo de admisión.'
    Session:
      type: apiKey
      in: cookie
      name: __Host-entralo-session
      description: Cookie por host/canal HttpOnly Secure SameSite=Lax; sesión server-side; no JWT localStorage.
    Csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit ligado a sesión y Origin exacto para mutaciones autenticadas.
    MpSignature:
      type: apiKey
      in: header
      name: x-signature
      description: 'Validación firma oficial MP y x-request-id/data.id. Algoritmo/ventana replay y modalidad exacta sujetos DR05; no auth Cognito ni IAM MP.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Key:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: 'Scope principal+operation+key; hash payload no sensible. Distinto payload 409. Resultado durable y key no expiran mientras obligación abierta; mínimo técnico60d, purga legal gate.'
    Match:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      description: ETag versión vigente; ausente428, mismatch412; no overwrite silencioso.
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    Error:
      description: 'ApiErrorResponse cerrado. Códigos/status/owner/operación del registry x-error-codes; código específico tiene prioridad sobre genérico cuando su condición coincide. status igual HTTP, sin echo sensibles. Retry-After obligatorio en 429/503, ausente en otros status. BFF preserva status/code/details seguros.'
      x-error-codes: {$ref: '#/x-error-codes'}
      x-error-codes-by-status:
        '400': [VALIDATION_ERROR, INVALID_REQUEST_BODY, WEBHOOK_ID_MISMATCH]
        '401': [AUTHENTICATION_REQUIRED, TOKEN_INVALID]
        '403': [ACCESS_DENIED]
        '404': [RESOURCE_NOT_FOUND]
        '409': [IDEMPOTENCY_CONFLICT, STATE_CONFLICT, VERSION_CONFLICT, CONTROL_PREPARATION_IN_PROGRESS, STOCK_UNAVAILABLE, ACCOUNT_EVENT_LIMIT, SALE_CLOSED, OFFER_STALE, ISSUANCE_CLOSED, ADJUSTMENT_NOT_FOUND, ADJUSTMENT_SCOPE_CONFLICT, REFUND_AMOUNT_CONFLICT]
        '412': [PRECONDITION_FAILED]
        '422': [BUSINESS_RULE_VIOLATION, REFUND_NOT_ELIGIBLE]
        '428': [PRECONDITION_REQUIRED]
        '429': [RATE_LIMITED]
        '500': [INTERNAL_ERROR]
        '503': [DEPENDENCY_UNAVAILABLE]
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}, description: 'Obligatorio sólo429/503; ausente en otros status. Segundos; no retry ciego de mutación.'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Accepted:
      description: 'Obligación durable aceptada, no éxito monetario/emisión. Consultar resource_path autenticado; replay misma operación.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationReceipt'}
    EventAccepted:
      description: 'Intención de create/replace durable. resource_path=/v1/admin/operations/{operation_id} invocable en la misma API. resource_id=event_id, event_version versión durable asociada; null sólo antes de materialización, consultar misma operación hasta no null. COMPLETED requiere ambos no null. BFF adapta ruta y conserva identidad/versión.'
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EventOperationReceipt'}
    VerificationUnavailable:
      description: '503 VERIFICACION_NO_DISPONIBLE. last_known sólo allowlist VerificationView o null; no autorización de ingreso ni raw proof. BFF conserva envelope; ante timeout propio usa last_known=null, nunca caché local.'
      x-error-codes: [VERIFICACION_NO_DISPONIBLE]
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
        Retry-After: {required: true, schema: {type: integer, minimum: 1}, description: 'Segundos de espera técnica, no extensión de deadline comercial.'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VerificationUnavailable'}
    WebhookBadRequest:
      description: '400 VALIDATION_ERROR para unknown schema/campo/tipo, INVALID_REQUEST_BODY para JSON inválido, WEBHOOK_ID_MISMATCH para query/body distintos. Ningún inbox/job/efecto monetario ni echo del payload.'
      x-error-codes: [VALIDATION_ERROR, INVALID_REQUEST_BODY, WEBHOOK_ID_MISMATCH]
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ApiErrorResponse'}
              - properties: {status: {const: 400}, code: {enum: [VALIDATION_ERROR, INVALID_REQUEST_BODY, WEBHOOK_ID_MISMATCH]}}
    WebhookConflict:
      description: '409 sólo inbox ID idéntico con hash de payload normalizado distinto. IDEMPOTENCY_CONFLICT; conserva inbox original sin overwrite/job duplicado ni efecto monetario.'
      x-error-codes: [IDEMPOTENCY_CONFLICT]
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ApiErrorResponse'}
              - properties: {status: {const: 409}, code: {const: IDEMPOTENCY_CONFLICT}}
  schemas:
    MercadoPagoDecimalId:
      oneOf: [{type: integer, minimum: 1}, {type: string, pattern: '^[1-9][0-9]{0,127}$'}]
      description: 'Entero JSON positivo o string decimal sin ceros iniciales; conversión exacta sin IEEE754 para comparación/hash. ID máximo 128 dígitos; ID integer debe cumplir mismo límite en aplicación.'
    MercadoPagoPaymentNotificationV1:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        id: {$ref: '#/components/schemas/MercadoPagoDecimalId', description: 'ID notificación, no data.id.'}
        type: {type: string, const: payment}
        action: {type: string, maxLength: 100}
        api_version: {type: string, maxLength: 20}
        date_created: {type: string, format: date-time}
        live_mode: {type: boolean}
        user_id: {$ref: '#/components/schemas/MercadoPagoDecimalId', description: 'ID vendedor del proveedor; privado, nunca métricas/colas internas.'}
        data:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {$ref: '#/components/schemas/MercadoPagoDecimalId'}
      description: 'Allowlist versionada mp-payment-webhook-v1. No ignorar ni pasar campos nuevos. Un api_version desconocido no cambia schema: sólo campos/tipos de esta policy se aceptan. Payload únicamente trigger de lookup, nunca autoridad monetaria. Fixtures en fixtures/mercado-pago.'
    Uuid: {type: string, format: uuid}
    Instant: {type: string, format: date-time, description: 'UTC Z; no sustituir precisión proveedor; comparación exacta, no tolerancia.'}
    Money: {type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$', description: COP decimal no float; scale2 HALF_UP por componente unitario.}
    ServiceRate: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$', description: 'Mismo decimal no negativo en escritura, lectura y OfferChangeRequestedV1; no nuevo máximo/tasa comercial.'}
    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, INVALID_REQUEST_BODY, WEBHOOK_ID_MISMATCH, AUTHENTICATION_REQUIRED, TOKEN_INVALID, ACCESS_DENIED, RESOURCE_NOT_FOUND, IDEMPOTENCY_CONFLICT, STATE_CONFLICT, VERSION_CONFLICT, CONTROL_PREPARATION_IN_PROGRESS, STOCK_UNAVAILABLE, ACCOUNT_EVENT_LIMIT, SALE_CLOSED, OFFER_STALE, ISSUANCE_CLOSED, ADJUSTMENT_NOT_FOUND, ADJUSTMENT_SCOPE_CONFLICT, REFUND_AMOUNT_CONFLICT, BUSINESS_RULE_VIOLATION, REFUND_NOT_ELIGIBLE, PRECONDITION_FAILED, PRECONDITION_REQUIRED, RATE_LIMITED, INTERNAL_ERROR, DEPENDENCY_UNAVAILABLE, VERIFICACION_NO_DISPONIBLE]
      description: 'Subconjunto HTTP del registry x-error-codes; código aplicable validado contra status/owner/operación.'
    Version: {type: integer, format: int64, minimum: 1}
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, code, message, path, trace_id, details]
      properties:
        timestamp: {$ref: '#/components/schemas/Instant'}
        status: {type: integer, minimum: 400, maximum: 599}
        error: {type: string, maxLength: 80}
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, maxLength: 300}
        path: {type: string, maxLength: 200, description: Template path sin identificador sensible ni query.}
        trace_id: {type: string, maxLength: 64}
        details:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [code, message, rejected_value]
            properties:
              field: {type: [string, 'null'], maxLength: 80}
              code: {$ref: '#/components/schemas/ErrorCode'}
              message: {type: string, maxLength: 200}
              rejected_value: {type: 'null'}
    OperationReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, state, resource_path]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        resource_id: {type: [string, 'null'], format: uuid, description: 'event_id en create/replace de evento; obligatorio en EventOperationReceipt.'}
        event_version: {type: [integer, 'null'], minimum: 1, description: 'Versión durable event en create/replace, no offer_version.'}
        state: {type: string, enum: [PENDING, COMPLETED, FAILED, UNKNOWN]}
        resource_path: {type: string, maxLength: 200, description: 'Ruta relativa consultable en la misma API que entrega el recibo; BFF adapta sólo la ruta, nunca el estado. No URL bearer.'}
        phase: {type: string, enum: [PREPARING, RECORDED, APPLIED, REOPENING, OPENED, CLOSED, SUPERSEDED], description: 'Obligatorio en operaciones CHANGE/CANCEL; PREPARING aún no registra hito.'}
        recorded_at: {type: [string, 'null'], format: date-time, description: 'Obligatorio en controls; null sólo preparación sin hito, después inmutable.'}
        failure_code: {oneOf: [{$ref: '#/components/schemas/ErrorCode'}, {type: string, const: CONTROL_SUPERSEDED}, {type: 'null'}]}
      dependentRequired:
        phase: [recorded_at, failure_code]
        resource_id: [event_version]
        event_version: [resource_id]
      allOf:
        - if: {required: [resource_id, event_version], properties: {resource_id: {}, event_version: {}, state: {const: COMPLETED}}}
          then: {properties: {resource_id: {type: string, format: uuid}, event_version: {$ref: '#/components/schemas/Version'}}}
      description: 'CHANGE/CANCEL requieren phase/recorded_at/failure_code; PREPARING sin registro. Otras operaciones no deben fabricar fase de evento.'
    EventOperationReceipt:
      allOf:
        - {$ref: '#/components/schemas/OperationReceipt'}
        - required: [resource_id, event_version]
          properties: {resource_id: {}, event_version: {}}
        - if: {properties: {state: {const: COMPLETED}}, required: [state]}
          then: {properties: {resource_id: {type: string, format: uuid}, event_version: {$ref: '#/components/schemas/Version'}}}
      description: 'Create/replace: misma operación consultable hasta identidad y versión materializadas. COMPLETED nunca null; versión de recibo no sustituye GET+ETag actual para edición concurrente.'
    Profile:
      type: object
      additionalProperties: false
      required: [user_id, status, contact_verified, version]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        contact_verified: {type: boolean}
        display_name: {type: [string, 'null'], maxLength: 100}
        version: {$ref: '#/components/schemas/Version'}
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: {type: [string, 'null'], maxLength: 100, description: Texto plano; no HTML. No cambio issuer/sub/email verificado.}
    IdentityBinding:
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer: {type: string, format: uri, maxLength: 300, description: Allowlist Cognito ambiente/canal.}
        subject: {type: string, maxLength: 128, minLength: 1, description: Debe coincidir token validado; no confianza en body.}
    AuthorizationRequest:
      type: object
      additionalProperties: false
      required: [user_id, action, event_id]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        action: {type: string, enum: [EVENT_ADMIN, REFUND_APPROVE, ADMIT, INVOICE_MANAGE]}
        event_id: {$ref: '#/components/schemas/Uuid'}
        device_id: {$ref: '#/components/schemas/Uuid'}
    AuthorizationDecision:
      type: object
      additionalProperties: false
      required: [allowed, permission_version, as_of]
      properties:
        allowed: {type: boolean}
        permission_version: {$ref: '#/components/schemas/Version'}
        as_of: {$ref: '#/components/schemas/Instant'}
    Contact:
      type: object
      additionalProperties: false
      required: [user_id, contact_version, available, email]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        contact_version: {$ref: '#/components/schemas/Version'}
        available: {type: boolean}
        email: {type: [string, 'null'], format: email, maxLength: 254, description: 'Privado Identity→Purchases avisos, no log/cola interna.'}
    TaxLine:
      type: object
      additionalProperties: false
      required: [line_kind, classification, taxable_base, rate, liable_role, qualification_reference]
      properties:
        line_kind: {type: string, enum: [NOMINAL, SERVICE]}
        classification: {type: string, enum: [TAXABLE, EXCLUDED_476_11, NOT_APPLICABLE]}
        taxable_base: {type: string, enum: [UNIT_NOMINAL, UNIT_SERVICE]}
        rate: {type: string, pattern: '^(0|1|0\.[0-9]{1,6})$', description: 'Tasa cargada validada, no19 universal.'}
        liable_role: {type: string, maxLength: 100, minLength: 1}
        qualification_reference: {type: string, maxLength: 200, minLength: 1, description: Referencia protegida validación externa noURL.}
    FiscalConfig:
      type: object
      additionalProperties: false
      required: [lines, cultural_applicable, cultural_authorization_reference, parafiscal_rate, validated_by]
      description: 'Propuesta física P04 pendiente SA/aprobación contractual; no implica validación legal nueva ni tasa universal.'
      properties:
        lines: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/TaxLine'}, description: 'Exactamente NOMINAL y SERVICE, sin duplicados.'}
        cultural_applicable: {type: boolean}
        cultural_authorization_reference: {type: [string, 'null'], maxLength: 200}
        parafiscal_rate: {type: [string, 'null'], enum: ['0.10', null], description: 'Sólo si applicable. No agrega línea cobro ni infiere base/retenciones.'}
        validated_by: {$ref: '#/components/schemas/Uuid'}
    Locality:
      type: object
      additionalProperties: false
      required: [locality_id, name, capacity, nominal]
      properties:
        locality_id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 100}
        capacity: {type: integer, minimum: 1}
        nominal: {$ref: '#/components/schemas/Money', description: Valor≥100000.00 validado semánticamente; sin máximo comercial.}
    EventWrite:
      type: object
      additionalProperties: false
      required: [title, starts_at, venue, localities, fiscal]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        starts_at: {$ref: '#/components/schemas/Instant'}
        venue: {type: string, minLength: 1, maxLength: 300}
        localities: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Locality'}}
        service_rate: {$ref: '#/components/schemas/ServiceRate', default: '0.15'}
        order_limit: {type: integer, minimum: 1, default: 8}
        account_event_limit: {type: integer, minimum: 1, default: 8}
        hold_ttl_seconds: {type: integer, minimum: 1, default: 1200}
        grace_seconds: {type: integer, minimum: 1, default: 1800}
        fiscal: {$ref: '#/components/schemas/FiscalConfig'}
    EventPublic:
      type: object
      additionalProperties: false
      required: [event_id, title, starts_at, venue, status, offer_version, localities, service_rate]
      properties:
        event_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, maxLength: 200}
        starts_at: {$ref: '#/components/schemas/Instant'}
        venue: {type: string, maxLength: 300}
        status: {type: string, enum: [PUBLISHED, CLOSING, CANCELLED]}
        offer_version: {$ref: '#/components/schemas/Version'}
        localities: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Locality'}}
        service_rate: {$ref: '#/components/schemas/ServiceRate'}
    EventManaged:
      type: object
      additionalProperties: false
      required: [event_id, event_version, status, event]
      properties:
        event_id: {$ref: '#/components/schemas/Uuid'}
        event_version: {$ref: '#/components/schemas/Version'}
        status: {type: string, enum: [DRAFT, PUBLISHING, PUBLISHED, CLOSING, CANCELLED]}
        event: {$ref: '#/components/schemas/EventWrite'}
      description: 'Representación administrativa actual, incluido draft/configuración; sólo EVENT_ADMIN por evento. event defaults materializados, fiscal sólo privada. No PII comprador ni datos de pago.'
    EventPage:
      type: object
      additionalProperties: false
      required: [items, page, size, has_next]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/EventPublic'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        has_next: {type: boolean}
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, page, size, has_next]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Order'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        has_next: {type: boolean}
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, size, has_next]
      properties:
