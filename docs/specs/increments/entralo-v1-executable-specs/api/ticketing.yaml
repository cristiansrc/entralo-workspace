    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}]
    get:
      operationId: readIssuanceGuard
      summary: Consultar guard de emisión
      tags: [Ticketing]
      description: 'SóloPurchases reconciler,read3sseguraidempotente; idissuance. OPEN/404 noausenciaprobada, CLOSEDterminal/ISSUED recupera; cero callbacksMP/Purchases.'
