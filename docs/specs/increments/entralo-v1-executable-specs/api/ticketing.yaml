      requestBody: {required: true, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/IssueTicketsRequest'}}}}
      responses:
        '200': {description: Emisión/guarddurablemismoconjunto, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/IssuanceResult'}}}}
        '400': *err
        '403': *err
        '409': *err
        '422': *err
        '429': *err
        '500': *err
        '503': *err
