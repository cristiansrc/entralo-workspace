    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}, {$ref: 'common.yaml#/components/parameters/Page'}, {$ref: 'common.yaml#/components/parameters/Size'}]
    get:
      operationId: readOwnTickets
      summary: Listar boletas propias privadas
      tags: [Ticketing]
      security: [{Workload: [], Cognito: [], Principal: []}]
      description: 'Sólo buyerowner derivado principal, no staff arbitrario. Read3s segura/idempotente/sin efectos, page0size20max100 ticket_idasc. QR/tokenverificación privados no-store/no logs; nunca público niBlockchain. Si no emitidas409 sin prometerentrega.'
      responses:
        '200': {description: Boletaspropiasprivadas, headers: {Cache-Control: {$ref: 'common.yaml#/components/headers/NoStore'}, Referrer-Policy: {$ref: 'common.yaml#/components/headers/NoReferrer'}}, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/TicketPage'}}}}
        '400': {$ref: 'common.yaml#/components/responses/Error'}
        '401': {$ref: 'common.yaml#/components/responses/Error'}
        '403': {$ref: 'common.yaml#/components/responses/Error'}
        '404': {$ref: 'common.yaml#/components/responses/Error'}
        '409': {$ref: 'common.yaml#/components/responses/Error'}
        '429': {$ref: 'common.yaml#/components/responses/Error'}
        '500': {$ref: 'common.yaml#/components/responses/Error'}
        '503': {$ref: 'common.yaml#/components/responses/Error'}
  /v1/verifications:
    post:
      operationId: readBoundedVerification
      summary: Consultar verificación pública acotada
      tags: [Ticketing]
      description: 'Público sin Cognito, workloadcanal/rate30minIP+10mindigest seeds pendientesWAFvalidación. POST readseguro/idempotente sinmutación, noKey; IDaleatorio256bit distintoQR, bodyredactado/noecho. 3s. Sólooperational/proof/minutoUTC/null; hash/leaf/tx/root/batch/proof/finetime/P03 bloqueados. NoPII/order/payment/rawticket/prehash/QR. Inválidos/inexistentesuniforme404; caída503últimoestadoinformativo noautorizatorno.'
      requestBody: {required: true, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/VerificationRequest'}}}}
      responses:
        '200': {description: Vistaacotada sin prueba pública, headers: {Cache-Control: {$ref: 'common.yaml#/components/headers/NoStore'}, Referrer-Policy: {$ref: 'common.yaml#/components/headers/NoReferrer'}}, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/VerificationView'}}}}
        '400': &err {$ref: 'common.yaml#/components/responses/Error'}
        '404': *err
        '429': *err
        '500': *err
        '503': {$ref: 'common.yaml#/components/responses/VerificationUnavailable'}
  /v1/admissions:
    post:
      operationId: admitTicketOnce
      summary: Registrar intento de ingreso único
      tags: [Ticketing]
      security: &staff [{Workload: [], Cognito: [], Principal: []}]
      description: 'ACCESS_STAFF actualIdentity por event/device fuera locks; token/assertion válido. ticket_reference protegida; intento+actor/event/device/key ligada payload; usoúnico+guard+control en tx y audit/outbox. 3s, no retry físicoautomático: consultamismointentoanteACKincierto. ADMITTED sóloprimeruso, replay nosegundoingreso; denied200decisiónnegocio nunca erroroculto. Caída503noingreso/caché.'
      parameters: [{$ref: 'common.yaml#/components/parameters/Key'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/AdmissionRequest'}}}}
      responses:
        '200': {description: Decisióndurable, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/AdmissionResult'}}}}
        '400': *err
        '401': *err
        '403': *err
        '404': *err
        '409': *err
        '429': *err
        '500': *err
        '503': *err
  /v1/admissions/{id}:
    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}]
    get:
      operationId: readAdmissionAttempt
      summary: Consultar intento de ingreso
      tags: [Ticketing]
      security: *staff
      description: 'ACCESS_STAFF actualscope/actorattempt; ledgerread3s/seguraidempotente, noacciontorno automática ni ingresonuevo porreplay.'
      responses:
        '200': {description: Resultadomismointento, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/AdmissionResult'}}}}
        '401': *err
        '403': *err
        '404': *err
        '429': *err
        '500': *err
        '503': *err
  /internal/v1/issuances:
    post:
      operationId: issueAcceptedSaleTickets
      summary: Emitir boletas de venta aceptada
      tags: [Ticketing]
      x-timeout-seconds: 10
      description: 'SóloPurchases issuanceworkload, mismo comando/handler/guard queSQS noattemptnuevo portransporte. Validaraccepted_at<deadline/payment_approved_at<grace/authorization/fence/permisopreviodurable; actualhora postdeadlinepermitida. Atomic guard+set+uniquelineordinal+outboxesdosdestinos; max3ledgerattempt/noreset. Cierre ganacaso409 ISSUANCE_CLOSED; ACKincierto nofallodefinitivo. Timeout10s/queryguardantesretryrefund; orderúnico/key.'
