openapi: 3.1.0
info: {title: Entralo Ticketing y Validation, version: 1.0.0, description: 'Lifecycle planning. Única vista pública allowlist pregate; no endpoint Blockchain/proof público. Guards terminales serializados.'}
security: [{Workload: []}]
servers: [{url: 'https://ticketing.entralo.invalid', description: 'Owner privado documental; host real sujeto a bootstrap.'}]
tags: [{name: Ticketing, description: 'Grupo generado del componente Ticketing y Validation.'}]
x-http-contract: {timeout_seconds: 3, connect_timeout_seconds: 1, read_max_attempts: 2, read_total_budget_seconds: 3, mutation_retry: same-key-only, caching: no-store, public_cache_seconds: 0, sensitive_body_logging: forbidden, error_contract: ApiErrorResponse, origin_policy: not-applicable, principal_validation: owner-validated}
paths:
