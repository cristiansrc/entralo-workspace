    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}]
    post:
      operationId: closeIssuanceTerminally
      summary: Cerrar emisión terminalmente
      tags: [Ticketing]
      description: 'SóloPurchases compensator. Contexto durable CloseIssuanceRequest con issuance_id=path ykeymismoissuance; guardserializacommitincl tardío, crea tombstone aun fila ausente o devuelveISSUEDexistente. Noreopen/refundpor404. 3s/resultadodurable; fallo503mantieneobligación sinrefundciego.'
