        '503': *err
  /internal/v1/orders/{id}/ticket-facts:
    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}]
    get:
      operationId: readCurrentTicketFacts
      summary: Consultar hechos actuales de boletas
      tags: [Ticketing]
      description: 'Sólo Purchases eligibilityworkload read3s segura/idempotente sin callback. TicketFacts.items refs/uso/status por boleta de orden (máximo1000, sinQR/secreto) y version/as_of primario. Permite mapping SUPPORT y scope remanente, used agregado no decide ajuste fuera scope. No autoriza refund. Membership completa canónica; no truncado silencioso.'
      responses:
        '200': {description: Hechos actuales, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/TicketFacts'}}}}
        '403': *err
        '404': *err
        '429': *err
        '500': *err
        '503': *err
  /internal/v1/orders/{id}/refund-guards:
    parameters: [{$ref: 'common.yaml#/components/parameters/Id'}]
    post:
      operationId: applyRefundGuard
      summary: Aplicar guard de devolución
      tags: [Ticketing]
      description: 'Sólo Purchases guardworkload, path order=snapshot.order. ADJUSTMENT mapping completo, ORDER OrderScopeSnapshot remanente; refs/digest/cycle exactos contra ticket local. Serializa uso/guard miembros, usada fuera no deniega CHANGE; dentro REJECTED_USED sin bloqueo parcial, CANCEL permite usada sin borrar. BLOCKED antes SUPPORT, sin dinero/fees Ticketing. Replay refund_id/cycle/control/digest mismoresultado, mismatch409. Ciclo RELEASED/tombstone nunca re-bloquea ante comando tardío; devuelve RELEASED. Release sólo eventos Purchases por rechazo predispatch o ausencia monetaria terminal, ACK cleanup durable; UNKNOWN/errorMP no release. No estado VIGENTE forzado ni cancelación revertida. Timeout3s; integration §8.1.'
      parameters: [{$ref: 'common.yaml#/components/parameters/Key'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/GuardRequest'}}}}
      responses:
        '200': {description: Guarddurable oconflictusoprobado, content: {application/json: {schema: {$ref: 'common.yaml#/components/schemas/TicketFacts'}}}}
