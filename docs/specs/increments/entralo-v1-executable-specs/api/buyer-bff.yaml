openapi: 3.1.0
info: {title: Entralo canal Buyer BFF, version: 1.0.0, description: 'Lifecycle planning. Browser same-origin→transporteVercel→RESTWAF→BFFKotlinAWS. Cookies de host buyer, no owner público directo. No reglas de stock/saga enBFF.'}
security: [{Session: []}]
servers: [{url: 'https://buyer.entralo.invalid', description: 'Canal documental same-origin; host real pendiente de bootstrap.'}]
tags: [{name: BuyerBff, description: 'Grupo generado del componente Buyer BFF.'}]
x-http-contract: {timeout_seconds: 5, connect_timeout_seconds: 1, read_max_attempts: 2, read_total_budget_seconds: 5, mutation_retry: same-key-only, caching: no-store, public_cache_seconds: 0, sensitive_body_logging: forbidden, error_contract: ApiErrorResponse, origin_policy: exact-allowlist, principal_validation: owner-validated}
x-owner-error-propagation: 'Conservar status de todo 4xx/429 del owner, code y details seguros ApiErrorResponse; path template del canal, trace_id correlacionado, rejected_value null. Conservar Retry-After 429/503 y no-store; sin 200 falso, sin convertir 4xx a 503. Timeout/transporte sin respuesta válida: 503 DEPENDENCY_UNAVAILABLE. Owner 5xx: 500 INTERNAL_ERROR o 503 DEPENDENCY_UNAVAILABLE sin datos internos. Sin retry de 4xx/429 ni de mutación incierta. Verificación conserva su envelope 503 explícito.'
x-error-code-registry: {source: 'common.yaml#/x-error-codes', registry_version: 1, parity: owner-status-code-details, unknown_owner_code_or_status: contract-drift}
x-owner-contract-drift: 'Status no declarado en proxy o code fuera registry/status/operación: 503 DEPENDENCY_UNAVAILABLE sanitizado e incidente bff_owner_contract_drift_total{owner,operation}; sin body/PII en log, no reintento monetario. Verificación usa VerificationUnavailable503 con code VERIFICACION_NO_DISPONIBLE y last_known=null. No reemplazar errores conocidos por fallback.'
